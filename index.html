<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f0e8" />
    <title>原神攻略工具集</title>
    <meta
      name="description"
      content="《原神》攻略图制作工具集 · 角色一图流 / 封面制作 / 图表 · 纯前端 · 本地处理 · 不收集数据"
    />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./favicon.ico" />

    <!-- 内联：CSS 到位之前先用令牌色铺底，避免白闪 -->
    <style>
      html {
        background: #f5f0e8;
      }
      html[data-theme="dark"] {
        background: #181715;
      }
      .boot {
        position: fixed;
        inset: 0;
        z-index: 99998;
        display: grid;
        place-items: center;
        font: 12px/1.6 system-ui, -apple-system, "PingFang SC", sans-serif;
        color: #8e8b82;
      }
    </style>

    <!-- ① 旧主题键一次性迁移：gtt_theme → gi-theme（只在后者缺失时写一次） -->
    <script>
      (function () {
        window.__THEME_KEY = "gi-theme";
        try {
          if (!localStorage.getItem(window.__THEME_KEY)) {
            var legacy = localStorage.getItem("gtt_theme");
            if (legacy === "dark" || legacy === "light") {
              localStorage.setItem(window.__THEME_KEY, legacy);
            }
          }
        } catch (e) {}
      })();
    </script>

    <!-- ② 主题预置 + 本次加载时间戳：同步、必须在样式之前，否则首帧闪白 -->
    <script>
      (function () {
        window.__pageLoadTs = Date.now();

        var root = document.documentElement;
        var saved = null;
        try {
          saved = localStorage.getItem(window.__THEME_KEY);
        } catch (e) {}
        var dark =
          saved === "dark" ||
          (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);

        root.dataset.theme = dark ? "dark" : "light";

        /* 首次样式生效期间禁掉一切过渡；load 之后解除（兜底 3s） */
        root.classList.add("theme-switching");
        var done = false;
        function unmute() {
          if (done) return;
          done = true;
          root.classList.remove("theme-switching");
        }
        window.addEventListener("load", unmute, { once: true });
        setTimeout(unmute, 3000);

        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#181715" : "#f5f0e8");
      })();
    </script>

    <!-- ③ 旧 hash 归一：#character → #/character。老书签、老二维码因此直接可用 -->
    <script>
      (function () {
        var h = location.hash;
        if (!h || h === "#" || h.slice(0, 2) === "#/") return;
        try {
          history.replaceState(null, "", location.pathname + location.search + "#/" + h.slice(1));
        } catch (e) {}
      })();
    </script>

    <!-- ④ 加载守卫：脚本没起来时自动带时间戳重载一次，并把实际路径打出来 -->
    <script>
      (function () {
        var FLAG = "gg-recover-at";
        var failed = [];

        function host() {
          return document.getElementById("app");
        }
        function ok() {
          var el = host();
          return !!el && (el.dataset.mounted === "1" || el.dataset.fatal === "1");
        }
        function lastTry() {
          try {
            return Number(sessionStorage.getItem(FLAG)) || 0;
          } catch (e) {
            return 0;
          }
        }

        function note() {
          var el = host();
          if (!el || el.dataset.fatal === "1") return;
          el.dataset.fatal = "1";

          var scripts = [];
          for (var i = 0; i < document.scripts.length; i++) {
            scripts.push("  " + (document.scripts[i].src || "(内联)"));
          }

          var lines = [
            "页面未能加载。",
            "",
            "当前地址：",
            "  " + location.href,
            "",
            "这个 HTML 引用的脚本：",
          ]
            .concat(scripts)
            .concat([
              "",
              "加载失败的脚本：",
              failed.length ? "  " + failed.join("\n  ") : "  （没有捕获到失败事件）",
              "",
              "如果你的脚本路径里没有 /genshin-guide/，说明打包的 base 配错了。",
              "如果路径正确但仍然失败，说明文件没有真正部署上去。",
              "",
              "请截图本页反馈。",
            ]);

          var pre = document.createElement("pre");
          pre.style.cssText =
            "position:fixed;inset:0;z-index:99999;margin:0;padding:16px;overflow:auto;" +
            "background:#181715;color:#f5f0e8;font:12px/1.7 ui-monospace,monospace;" +
            "white-space:pre-wrap;word-break:break-word";
          pre.textContent = lines.join("\n");
          el.appendChild(pre);
        }

        function recover() {
          if (ok()) return;

          if (Date.now() - lastTry() < 30000) {
            note();
            return;
          }

          try {
            sessionStorage.setItem(FLAG, String(Date.now()));
          } catch (e) {}

          var base = location.href.split("#")[0].split("?")[0];
          location.replace(base + "?t=" + Date.now() + location.hash);
        }

        window.addEventListener(
          "error",
          function (e) {
            if (e.target && e.target.tagName === "SCRIPT") {
              failed.push(e.target.src || "(内联)");
              recover();
            }
          },
          true,
        );

        setTimeout(recover, 4000);
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot">正在载入工具集…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
