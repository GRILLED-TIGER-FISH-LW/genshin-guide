name: Reorg (temp)

# 临时搬家小工：只干手机上 GitHub 网页做不到的事 —— 一次把一堆文件 git mv 走。
# 批 4 合并后连这个文件一起删掉。
# 规矩：按写死的清单 mv；精确字符串替换，原串一处都找不到就报错停下；
# 永远推到 reorg/batch-4 分支，不碰 main；构建不通过就不推。
#
# 用法：Actions → 左侧「Reorg (temp)」→ Run workflow → 批次选 4。

on:
  workflow_dispatch:
    inputs:
      batch:
        description: '批次：4 = 一图流自己的样式归位 + 删两个死组件'
        required: true
        default: '4'
        type: choice
        options: ['4']

permissions:
  contents: write

jobs:
  reorg:
    runs-on: ubuntu-latest
    env:
      BATCH: ${{ inputs.batch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 搬家并改引用
        run: |
          set -euo pipefail
          git config user.name "reorg-bot"
          git config user.email "reorg-bot@users.noreply.github.com"

          # 精确替换：文件 原串 新串。原串一处都找不到就报错退出。
          sub() {
            if ! grep -qF -- "$2" "$1"; then
              echo "::error file=$1::没找到要替换的字符串：$2"
              exit 1
            fi
            FROM="$2" TO="$3" perl -0777 -pi -e 's/\Q$ENV{FROM}\E/$ENV{TO}/g' "$1"
          }

          echo "批次：$BATCH"

          # ---------- 批 4：一图流的样式归位 + 删死组件 ----------
          # public/shared/css 那 10 个文件全站只有「角色一图流」一个页面在用
          # （theme.css @import 了另外 7 个），不该挂在 shared 名下 —— 整个
          # 目录跟着它的唯一使用者走，shared/ 就只剩真共享的两样。
          if [ "$BATCH" = "4" ]; then

            # 别的文件还在引用这两个组件就报错停下：宁可任务失败，不可误删
            if grep -rl "Tabs\.vue\|Combobox\.vue\|<Tabs\|<Combobox" src --include='*.vue' \
               | grep -qv "^src/components/Tabs\.vue$\|^src/components/Combobox\.vue$"; then
              echo "::error::Tabs / Combobox 还有引用，先查清楚再删"
              exit 1
            fi

            mkdir -p public/tools/character/css
            for f in buttons.css dropdown.js editor.css home.css inputs.css overlays.css \
                     panels.css preview.css theme-init.js theme.css; do
              git mv "public/shared/css/$f" "public/tools/character/css/$f"
            done
            rmdir public/shared/css 2>/dev/null || true

            sub public/tools/character/index.html '../../shared/css/theme-init.js' 'css/theme-init.js'
            sub public/tools/character/index.html '../../shared/css/dropdown.js' 'css/dropdown.js'
            sub public/tools/character/index.html '../../shared/css/theme.css' 'css/theme.css'
            sub public/tools/character/css/theme-init.js 'shared/css/theme-init.js' 'tools/character/css/theme-init.js'
            sub public/tools/character/style.css 'shared/css/preview.css' 'css/preview.css'

            git rm -q src/components/Tabs.vue src/components/Combobox.vue
          fi

          git add -A
          git status --short

          npm install --no-audit --no-fund
          npm run build

          git commit -m "reorg: 批次 $BATCH"
          git push -f origin "HEAD:refs/heads/reorg/batch-$BATCH"
