name: Reorg

# 机械改动 + 大删除的通用机器人（清单区就在下面 env 里）。
#   改清单 → Actions 里选 Reorg → Run workflow（清单名用默认的即可）
#   → 它在 reorg-<清单名> 分支上做完、跑一次 npm run build → 你去 compare 页面合并。
#   任一步失败都不会推分支、不会动 main。
#   这份工作流常驻：跑完只推分支，自己不会消失，下次换掉 env 里那四段清单接着用。
#
# 清单格式
#   ① MOVES    一行一条：旧路径 -> 新路径
#   ② EDITS    一条一个块，格式固定四段：
#                 ### 文件路径
#                 <<<<
#                 原文（可多行，逐字查找；找不到就中止；同一文件里要唯一，多处就分几个块写）
#                 >>>>
#                 <<<<
#                 新文
#                 >>>>
#   ③ DELETES  一行一个路径（文件或目录都行）
#   ④ CHECKS   一行一条命令，非 0 即中止（失败会打印该命令的输出）
#   经验：自检要查「实际读取」，别查名字 —— 新文注释里顺手写个文件名就会把自己卡住（栽过一次）。
#
# 这一批（float-danger）：预览框右上角的删除 / 清空按钮统一。
#   · 现状三个工具各写各的：一图流用 `text-danger! border-danger/30!` 从外面覆盖 float 档颜色，
#     两个封面只把图标染红（描边还是灰的）—— 同一个位置两种观感，就是「不统一」的根源
#   · 给 Btn 加正式档位 float-danger（浮层外观 + 图标与描边都走 danger，自带 border-danger/30），
#     一图流 / 视频封面 / 合集封面三处改成用它，AGENTS 里「已知例外」那条随之删掉
#   · 顺手把 PreviewFrame 的裸 hex 深底（#121212）收进令牌 --color-preview（不随主题变，注释写明）
#   · 不动 public/tools/ 的三个 iframe 老页面（等它们搬进 SPA 时一并改）
#   · 跨仓库：`--color-preview` 和 tokens.css 的同步日期之后要同步到 adventurer-handbook（另有小清单）

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 清单名（会建 reorg-<名字> 分支）
        required: true
        default: float-danger

permissions:
  contents: write

