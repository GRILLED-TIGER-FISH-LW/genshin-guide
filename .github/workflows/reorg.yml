name: Reorg (temp)

# 临时搬家小工：整理仓库结构用。批 1~3 全部合并后，删掉这个文件。
# 为什么需要它：手机上 GitHub 网页只能编辑文本，图片/字体这类二进制文件
# 没法改名字、没法挪位置。这个 Action 只做两件事：按下面写死的清单 git mv、
# 做精确字符串替换（一处都没匹配到就报错停下，绝不静默改错）。
# 永远推到 reorg/batch-N 分支，不碰 main；构建不通过就不推。
# 用法：Actions → 左侧 Reorg (temp) → Run workflow → 选批次号。

on:
  workflow_dispatch:
    inputs:
      batch:
        description: '批次：1 = 搬进 public/；2 = shared 内部归位；3 = 摊到 public 顶层'
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3']

permissions:
  contents: write
  pull-requests: write

jobs:
  reorg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 搬家 + 改引用
        run: |
          set -euo pipefail
          git config user.name "reorg-bot"
          git config user.email "reorg-bot@users.noreply.github.com"

          # 精确替换：文件 原串 新串。匹配不到就报错退出。
          sub() {
            python3 -c '
import sys
f, a, b = sys.argv[1], sys.argv[2], sys.argv[3]
with open(f, "r", encoding="utf-8", newline="") as fh:
    s = fh.read()
if a not in s:
    print("::error file=%s::没找到要替换的字符串：%s" % (f, a))
    raise SystemExit(1)
with open(f, "w", encoding="utf-8", newline="") as fh:
    fh.write(s.replace(a, b))
' "$1" "$2" "$3"
          }

          B="${{ inputs.batch }}"

          # ---------------- 批 1：搬进 public/（URL 一处不变） ----------------
          if [ "$B" = "1" ]; then
            git mv shared public/shared
            git mv tools public/tools
            git mv favicon.ico public/favicon.ico
            sub package.json 'vite build && cp -r shared dist/shared && cp -r tools dist/tools && cp favicon.ico dist/favicon.ico' 'vite build'
            sub vite.config.js "path('shared/ui-icons.js')" "path('public/shared/ui-icons.js')"
            sub vite.config.js "path('shared/gi-icons/icon-loader.js')" "path('public/shared/gi-icons/icon-loader.js')"
          fi

          # ---------------- 批 2：shared 内部归位 ----------------
          if [ "$B" = "2" ]; then
            git rm -q public/shared/theme.css
            git mv public/shared/assets/portrait public/shared/assets/art
            git mv public/shared/assets/characters/element public/shared/assets/element
            git mv public/shared/assets/video-cover public/shared/assets/cover
            mkdir -p public/shared/assets/game
            git mv public/shared/gi-icons/UI_AvatarIcon_Traveler.webp public/shared/assets/game/UI_AvatarIcon_Traveler.webp
            sub public/shared/gi-icons/icon-dict.js 'shared/assets/portrait/' 'shared/assets/art/'
            sub public/shared/data/character-art.txt 'shared/assets/portrait/' 'shared/assets/art/'
            sub public/tools/character/app.js 'shared/assets/characters/element/' 'shared/assets/element/'
            sub src/lib/videoCover.js 'shared/assets/video-cover/' 'shared/assets/cover/'
            sub src/composables/useIconDict.js 'shared/gi-icons/UI_AvatarIcon_Traveler.webp' 'shared/assets/game/UI_AvatarIcon_Traveler.webp'
            sub src/composables/useIconDict.js 'shared/gi-icons/${row.key}' 'shared/assets/game/${row.key}'
            sub public/shared/gi-icons/icon-dict.js 'shared/gi-icons/UI_AvatarIcon_Traveler.webp' 'shared/assets/game/UI_AvatarIcon_Traveler.webp'
          fi

          # ---------------- 批 3：摊到 public 顶层 ----------------
          if [ "$B" = "3" ]; then
            git mv public/shared/assets public/images
            git mv public/shared/fonts public/fonts
            git mv public/shared/data public/data
            git mv public/shared/saves public/saves
            sub src/lib/videoCover.js 'shared/data/' 'data/'
            sub src/lib/videoCover.js 'shared/assets/' 'images/'
            sub src/lib/videoCover.js "const m = String(raw || '').match(/^(?:\.\.\/)+shared\//)" "const m = String(raw || '').match(/^(?:\.\.\/)+/)"
            sub src/lib/videoCover.js 'return m ? `${BASE}shared/${String(raw).slice(m[0].length)}` : raw || ""' 'return m ? BASE + String(raw).slice(m[0].length) : raw || ""'
            sub src/lib/fonts.js 'BASE_URL}shared/${path}' 'BASE_URL}${path}'
            sub src/composables/useIconDict.js "const i = s.indexOf('shared/')" "const i = ['shared/', 'images/', 'fonts/', 'data/', 'saves/'].map((k) => s.indexOf(k)).filter((n) => n >= 0).sort((a, b) => a - b)[0] ?? -1"
            sub src/composables/useIconDict.js 'shared/assets/' 'images/'
            sub src/composables/useIconDict.js 'shared/data/characters.txt' 'data/characters.txt'
            sub src/composables/useIconDict.js 'shared/data/character-art.txt' 'data/character-art.txt'
            sub public/shared/gi-icons/icon-dict.js 'shared/assets/' 'images/'
            sub public/data/character-art.txt 'shared/assets/' 'images/'
            sub public/tools/character/app.js '../../shared/data/' '../../data/'
            sub public/tools/character/app.js '../../shared/fonts/' '../../fonts/'
            sub public/tools/character/app.js '../../shared/saves/' '../../saves/'
            sub public/tools/character/app.js '../../shared/assets/element/' '../../images/element/'
          fi

          git add -A
          git status --short

          npm install --no-audit --no-fund
          npm run build

          git commit -m "reorg: 批次 $B"
          git push -f origin "HEAD:refs/heads/reorg/batch-$B"
