name: Reorg

# 机械改动 + 大删除的通用机器人（清单区就在下面 env 里）。
#   改清单 → Actions 里选 Reorg → Run workflow（清单名用默认的即可）
#   → 它在 reorg-<清单名> 分支上做完、跑一次 npm run build → 你去 compare 页面合并。
#   任一步失败都不会推分支、不会动 main。
#
# 清单格式
#   ① MOVES    一行一条：旧路径 -> 新路径
#   ② EDITS    一条一个块，格式固定四段：
#                 ### 文件路径
#                 <<<<
#                 原文（可多行，逐字查找；找不到就中止）
#                 >>>>
#                 <<<<
#                 新文
#                 >>>>
#   ③ DELETES  一行一个路径（文件或目录都行）
#   ④ CHECKS   一行一条命令，非 0 即中止（失败会打印该命令的输出）
#   经验：自检要查「实际读取」，别查名字 —— 新文注释里顺手写个文件名就会把自己卡住（栽过一次）。
#
# 这一批（image-dict）：字典改名。它已经不只管图标。
#   · 两个共享脚本搬出 gi-icons/：icon-dict.js → image-dict.js、icon-loader.js → image-loader.js
#   · 全局变量 window.ICON_DICT / ICON_LIB → IMAGE_DICT / IMAGE_LIB
#   · 虚拟模块 virtual:gg-icon-lib → virtual:gg-image-lib
#   · 页面 / 路由 / 文案：图标字典 → 图片字典，路由 #/icon-editor → #/image-dict
#   · 注意：EDITS 里的文件名一律写「搬完之后的路径」（工序是 MOVES → EDITS → DELETES → CHECKS）
#   · 跨仓库：adventurer-handbook 的 4 个文件必须同批改（那边也有一个同样的机器人清单）

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 清单名（会建 reorg-<名字> 分支）
        required: true
        default: image-dict

permissions:
  contents: write

