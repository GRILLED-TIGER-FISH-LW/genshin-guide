name: Reorg

# 临时搬家小工：只干手机上 GitHub 网页端做不到的事 —— 一次把一堆文件 git mv 走、
# 一批字符串精确替换、删几个文件。改完跑一次构建，构建通过才推分支。
#
# 用法：① 填下面的「清单区」→ 提交   ② Actions → 左侧「Reorg」→ Run workflow（从 main 跑）
#      ③ 用 https://github.com/GRILLED-TIGER-FISH-LW/<仓库>/compare/main...reorg/<分支名> 开 PR
#      ④ 用完清空清单区；哪天不搬东西了就把这个文件删掉
#
# 铁律：只推 reorg/<分支名>，永远不碰 main；清单里的原文找不到就报错停下（宁可失败，不可误删）。

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '分支名后缀（推到 reorg/<这个名字>）'
        required: true
        default: 'batch-1'

permissions:
  contents: write

env:
  # ── 清单区① 改名 / 挪位置：每行「旧路径 -> 新路径」 ──
  MOVES: |
    # 例：public/old/a.css -> public/new/a.css
  # ── 清单区② 精确替换：每行「文件 ||| 原文 ||| 新文」 ──
  EDITS: |
    # 例：public/x/index.html ||| old/a.js ||| new/a.js
  # ── 清单区③ 删文件：每行一个路径 ──
  DELETES: |
    # 例：public/old/gone.css
  # （整行以 # 开头的是注释，空行不算；三条清单都留空 = 什么都没做，会直接报错停下）

jobs:
  reorg:
    runs-on: ubuntu-latest
    env:
      B: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 按清单搬家
        run: |
          set -euo pipefail
          git config user.name "reorg-bot"
          git config user.email "reorg-bot@users.noreply.github.com"

          # 去掉首尾空白；空行与整行注释返回非零
          pick() {
            local t
            t="$(printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            case "$t" in '' | '#'*) return 1 ;; esac
            printf '%s' "$t"
          }

          # 精确替换：原文一处都找不到就报错退出
          sub() {
            if ! grep -qF -- "$2" "$1"; then
              echo "::error file=$1::没找到要替换的字符串：$2"
              exit 1
            fi
            FROM="$2" TO="$3" perl -0777 -pi -e 's/\Q$ENV{FROM}\E/$ENV{TO}/g' "$1"
            echo "edit: $1"
          }

          echo "分支：reorg/$B"

          # ① 改名 / 挪位置
          while IFS= read -r line; do
            line="$(pick "$line")" || continue
            case "$line" in
              *' -> '*) from="${line%% -> *}"; to="${line##* -> }" ;;
              *) echo "::error::清单①格式不对（要「旧路径 -> 新路径」）：$line"; exit 1 ;;
            esac
            mkdir -p "$(dirname "$to")"
            git mv -f "$from" "$to"
            echo "move: $from -> $to"
          done <<< "$MOVES"

          # ② 精确替换
          while IFS= read -r line; do
            line="$(pick "$line")" || continue
            f="${line%%|||*}"; rest="${line#*|||}"
            case "$rest" in
              *'|||'*) ;;
              *) echo "::error::清单②格式不对（要「文件 ||| 原文 ||| 新文」）：$line"; exit 1 ;;
            esac
            sub "$(printf '%s' "$f" | sed -e 's/[[:space:]]*$//')" "${rest%%|||*}" "${rest#*|||}"
          done <<< "$EDITS"

          # ③ 删文件
          while IFS= read -r line; do
            line="$(pick "$line")" || continue
            git rm -q "$line"
            echo "rm: $line"
          done <<< "$DELETES"

          git add -A
          echo "---- 动了这些文件 ----"
          git status --short
          git diff --cached --quiet && { echo "::error::清单没产生任何改动，先检查路径 / 字符串"; exit 1; }

          npm install --no-audit --no-fund
          npm run build

          git commit -m "reorg: $B"
          git push -f origin "HEAD:refs/heads/reorg/$B"
