  # ---------- ③ 删文件 / 目录 ----------
  DELETES: |
    public/data/characters.txt
    public/data/character-art.txt

  # ---------- ④ 自检 ----------
  CHECKS: |
    ! grep -n "text('data/characters.txt')" src/lib/videoCover.js
    ! grep -n "text('data/character-art.txt')" src/lib/videoCover.js
    ! grep -n 'CHARS_SRC' src/composables/useIconDict.js
    ! grep -n 'PORTRAIT_SRC' src/composables/useIconDict.js
    ! grep -n 'characters\.txt' src/composables/useIconDict.js
    ! grep -n 'character-art\.txt' src/composables/useIconDict.js
