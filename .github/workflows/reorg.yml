    grep -q "'window.IMAGE_DICT = {', '  config: {'" src/composables/useImageDict.js
    grep -q "shared/image-dict.js', 'IMAGE_DICT'" src/composables/useIconLib.js
    grep -q "shared/image-dict.js', 'IMAGE_DICT'" src/lib/videoCover.js
    node --check src/composables/useImageDict.js && node --check src/composables/useIconLib.js && node --check src/lib/videoCover.js && node --check src/router.js && node --check vite.config.js && node --check public/shared/image-loader.js && node --check public/shared/image-dict.js
