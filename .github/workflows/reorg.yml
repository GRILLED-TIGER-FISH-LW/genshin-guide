name: Reorg

# 清单式 Action：机械改动 / 大删除 / 全仓库同一个字符串替换 / 文档批量改 —— 都走这里。
#   清单在仓库根的 `reorg-list.txt`（四段：MOVES / EDITS / DELETES / CHECKS，格式见那个文件顶部）。
#   跑法：改 reorg-list.txt → 提交 → Actions → Reorg → Run workflow（清单名会变成分支名 reorg-<名字>）
#        → 它在 reorg-<清单名> 分支上做完 + 跑一次 npm run build → 去 compare 页面合并。
#   任一步失败都不推分支、不碰 main。
#   **这份工作流常驻、不用再动**（清单不在它里面了）；两个仓库的这份文件逐字节相同。
#
# 经验（都是栽过的）：
#   · 自检要查「实际行为」，别查名字 —— 新文注释里顺手写个被检查的字符串会把自己卡住；
#   · 原文在同一文件里出现不止一次也中止（否则 str.replace 会顺手改掉别处）；
#   · EDITS 段里不要写 `#` 注释行（会被当成文件路径）；注释写在段外或 MOVES/DELETES/CHECKS 段里。

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 清单名（会建 reorg-<名字> 分支）
        required: true
        default: reorg
      list:
        description: 清单文件路径
        required: true
        default: reorg-list.txt

permissions:
  contents: write

jobs:
  reorg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 按清单区改
        env:
          LIST_FILE: ${{ inputs.list }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          from pathlib import Path

          list_path = Path(os.environ['LIST_FILE'])
          if not list_path.is_file():
              print('中止：找不到清单文件 ' + str(list_path))
              sys.exit(1)
          LIST = list_path.read_text(encoding='utf-8')

          def section(name):
              # 取 == NAME == 与下一个 == … == 之间的内容；段外的行一律忽略
              m = re.search(r'^==\s*%s\s*==\s*$(.*?)(?=^==\s*\w+\s*==\s*$|\Z)' % name, LIST, re.S | re.M)
              return m.group(1) if m else ''

          def pick(text):
              return [l.strip() for l in text.split('\n') if l.strip() and not l.strip().startswith('#')]

          def split_records(text):
              # 只在「标记区外」的行首 ### 才当新块的开始 —— 原文 / 新文里出现
              # 行首 ###（比如要改文档里的小标题）不会被切错。
              out, cur, inside = [], None, False
              for line in text.split('\n'):
                  s = line.strip()
                  guarded = inside or s in ('<<<<', '>>>>')
                  if s == '<<<<':
                      inside = True
                  elif s == '>>>>':
                      inside = False
                  if not guarded and line.startswith('###'):
                      if cur is not None:
                          out.append('\n'.join(cur))
                      cur = [line[3:].strip()]
                  else:
                      if cur is None:
                          if not line.strip():
                              continue
                          cur = []
                      cur.append(line)
              if cur:
                  out.append('\n'.join(cur))
              return out

          def blocks(text):
              out, cur, inside = [], None, False
              for line in text.split('\n'):
                  s = line.strip()
                  if s == '<<<<':
                      inside, cur = True, []
                      continue
                  if s == '>>>>':
                      inside = False
                      out.append('\n'.join(cur))
                      cur = None
                      continue
                  if inside:
                      cur.append(line)
              return out

          def die(msg):
              print('中止：' + msg)
              sys.exit(1)

          moves = pick(section('MOVES'))
          records = split_records(section('EDITS'))
          deletes = pick(section('DELETES'))
          checks = pick(section('CHECKS'))

          print('清单文件 %s：MOVES %d 条 / EDITS %d 块 / DELETES %d 条 / CHECKS %d 条'
                % (list_path, len(moves), len(records), len(deletes), len(checks)))

          if not (moves or records or deletes):
              die('清单四段里没有要做的改动')
          if not checks:
              die('清单里没有 CHECKS：每批都要有自检')

          # ① 搬
          for entry in moves:
              from_, sep, to = entry.partition(' -> ')
              if not sep:
                  die('MOVES 这行没有 -> ：' + entry)
              subprocess.run(['git', 'mv', from_, to], check=True)
              print('mv %s -> %s' % (from_, to))

          # ② 替换
          for rec in records:
              lines = rec.split('\n')
              path = lines[0].strip()
              got = blocks('\n'.join(lines[1:]))
              if len(got) != 2:
                  die('%s：应有原文/新文两段 <<<< … >>>>，实际 %d 段' % (path, len(got)))
              src, dst = got
              p = Path(path)
              if not p.is_file():
                  die('缺文件：' + path)
              text = p.read_text(encoding='utf-8')
              if src not in text:
                  die('没找到原文：' + path)
              if text.count(src) != 1:
                  die('原文在 %s 里出现 %d 次，不唯一：%s' % (path, text.count(src), src.split('\n')[0][:60]))
              p.write_text(text.replace(src, dst), encoding='utf-8')
              print('改了 ' + path)

          # ③ 删
          for path in deletes:
              subprocess.run(['git', 'rm', '-r', '-q', '--ignore-unmatch', path], check=True)
              print('rm ' + path)

          # ④ 自检：失败时把命令输出也打出来
          for check in checks:
              print('check: ' + check)
              r = subprocess.run(['bash', '-c', check], capture_output=True, text=True)
              if r.returncode != 0:
                  print(r.stdout, r.stderr)
                  die('自检没过：' + check)
              print('  ok')

          subprocess.run(['git', 'add', '-A'], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode == 0:
              die('清单没有产生任何改动')
          print(subprocess.run(['git', 'status', '--short'], capture_output=True, text=True).stdout)
          PY

      - name: 构建验证
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: 推到分支
        run: |
          set -euo pipefail
          B="${{ inputs.batch }}"
          git config user.name "reorg-bot"
          git config user.email "reorg-bot@users.noreply.github.com"
          git commit -m "reorg: $B"
          git push -f origin "HEAD:refs/heads/reorg-$B"
