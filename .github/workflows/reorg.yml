name: Reorg

# 机械改动 + 大删除的通用机器人（清单区就在下面 env 里）。
#   改清单 → Actions 里选 Reorg → Run workflow（清单名用默认的即可）
#   → 它在 reorg-<清单名> 分支上做完、跑一次 npm run build → 你去 compare 页面合并。
#   任一步失败都不会推分支、不会动 main。
#
# 清单格式
#   ① MOVES    一行一条：旧路径 -> 新路径
#   ② EDITS    一条一个块，格式固定四段：
#                 ### 文件路径
#                 <<<<
#                 原文（可多行，逐字查找；找不到就中止）
#                 >>>>
#                 <<<<
#                 新文
#                 >>>>
#   ③ DELETES  一行一个路径（文件或目录都行）
#   ④ CHECKS   一行一条命令，非 0 即中止（失败会打印该命令的输出）
#   经验：自检要查「实际读取」（grep "text('data/…')"），别查名字 ——
#         新文注释里顺手写个文件名就会把自己卡住（栽过一次）。

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 清单名（会建 reorg-<名字> 分支）
        required: true
        default: txt-retire

permissions:
  contents: write

env:
  # ---------- ① 搬文件：旧路径 -> 新路径 ----------
  MOVES: |
    # 例：src/old.js -> src/new.js

  # ---------- ② 替换 ----------
  EDITS: |
    ### src/lib/videoCover.js
    <<<<
    export async function loadData() {
      const [characterTxt, artTxt, namecardTxt, logoTxt] = await Promise.all([
        text('data/characters.txt'),
        text('data/character-art.txt'),
        text('data/namecards.txt'),
        text('data/logos.txt'),
      ])

      const orders = {}
      for (const line of lines(characterTxt)) {
        const parts = line.split(/[\s,，\t]+/)
        if (parts.length < 2) continue
        const order = parseInt(parts[0], 10)
        const name = parts.slice(1).join(' ').trim()
        if (order && name) orders[name] = order
      }

      const art = {}
      for (const line of lines(artTxt)) {
        const m = line.match(/^(\d+)\s+(\S+)\s*(.*)$/)
        if (m) art[m[2]] = artUrl((m[3] || '').trim())
      }

      const namecards = {}
      for (const line of lines(namecardTxt)) {
        const m = line.match(/^(\d+)\s+(\S+)\s+(https?:\/\/\S+)$/)
        if (m) namecards[m[2]] = m[3]
      }

      const logos = []
      for (const line of lines(logoTxt)) {
        const parts = line.split(/\s+/)
        if (parts.length >= 2) logos.push({ name: parts[0], file: parts[1] })
      }
      if (!logos.length) logos.push({ name: '原神', file: DEFAULT_LOGO_FILE })

      return { orders, art, namecards, logos }
    }
    >>>>
    <<<<
    /* 数据来源换成图标字典（shared/gi-icons/icon-dict.js）：序号 / 立绘 / 名片都在里面，
       原来那三张数据表从这一版起退休，本文件不再读 data/ 下的表（只剩 logos）。
       字典里「旅行者·冰」这类分元素条目是独立一条，所以编号与名片不会再丢。 */
    export async function loadData() {
      const [logoTxt] = await Promise.all([text('data/logos.txt')])
      await iconLib()

      const dict = window.ICON_DICT || {}
      const cardCfg = dict.config?.characters?.card

      const orders = {}
      const art = {}
      const namecards = {}
      for (const [key, item] of Object.entries(dict.characters || {})) {
        const name = item.name || key
        if (item.order) orders[name] = item.order
        if (item.art?.url) art[name] = item.art.url

        const cardKey = item.card?.key
        if (!cardKey || !cardCfg) continue
        const src = item.card?.alt && cardCfg.alt ? cardCfg.alt : cardCfg
        if (src.prefix) namecards[name] = src.prefix + cardKey + (src.ext || '')
      }

      const logos = []
      for (const line of lines(logoTxt)) {
        const parts = line.split(/\s+/)
        if (parts.length >= 2) logos.push({ name: parts[0], file: parts[1] })
      }
      if (!logos.length) logos.push({ name: '原神', file: DEFAULT_LOGO_FILE })

      return { orders, art, namecards, logos }
    }
    >>>>

    ### src/lib/videoCover.js
    <<<<
    /* character-art.txt / 旧配置里的路径是工具页时代的相对路径（../../shared/…）。
       SPA 里相对路径按仓库根算，会跑到域名外面 —— 统一改成站点基址。
       http(s) / data: 原样放行。 */
    >>>>
    <<<<
    /* 旧配置里存的是工具页时代的相对路径（../../shared/…），走这里统一改写成站点基址。
       姓名与序号那三张 txt 已经退休，本函数现在只服务旧配置的兼容。 */
    >>>>

    ### src/lib/videoCover.js
    <<<<
     *   1. 数据与几何：状态默认值、模式表、character-art / namecards / logos 解析、
     *      胶囊与浮层几何、文本测量、签名栏
    >>>>
    <<<<
     *   1. 数据与几何：状态默认值、模式表、图标字典里的序号 / 立绘 / 名片与 logos 解析、
     *      胶囊与浮层几何、文本测量、签名栏
    >>>>

  # ---------- ③ 删文件 / 目录 ----------
  DELETES: |
    public/data/namecards.txt
    public/tools/character

  # ---------- ④ 自检 ----------
  CHECKS: |
    ! grep -n "text('data/characters.txt')" src/lib/videoCover.js
    ! grep -n "text('data/character-art.txt')" src/lib/videoCover.js
    ! grep -n "text('data/namecards.txt')" src/lib/videoCover.js
    grep -n '图标字典里的序号 / 立绘 / 名片' src/lib/videoCover.js
    grep -n "text('data/logos.txt')" src/lib/videoCover.js
    test ! -e public/data/namecards.txt
    test ! -d public/tools/character
    grep -n "text('data/" src/lib/videoCover.js || true

jobs:
  reorg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 按清单区改
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          from pathlib import Path

          def pick(text):
              return [l.strip() for l in text.split('\n') if l.strip() and not l.strip().startswith('#')]

          def blocks(text):
              out, cur, inside = [], None, False
              for line in text.split('\n'):
                  s = line.strip()
                  if s == '<<<<':
                      inside, cur = True, []
                      continue
                  if s == '>>>>':
                      inside = False
                      out.append('\n'.join(cur))
                      cur = None
                      continue
                  if inside:
                      cur.append(line)
              return out

          def die(msg):
              print('中止：' + msg)
              sys.exit(1)

          # ① 搬
          for entry in pick(os.environ.get('MOVES', '')):
              from_, sep, to = entry.partition(' -> ')
              if not sep:
                  die('MOVES 这行没有 -> ：' + entry)
              subprocess.run(['git', 'mv', from_, to], check=True)
              print('mv %s -> %s' % (from_, to))

          # ② 替换
          edits = os.environ.get('EDITS', '')
          records = re.split(r'(?m)^###[ \t]*', edits)[1:]
          if edits.strip() and not records:
              die('EDITS 里没有 ### 头')
          for rec in records:
              lines = rec.split('\n')
              path = lines[0].strip()
              got = blocks('\n'.join(lines[1:]))
              if len(got) != 2:
                  die('%s：应有原文/新文两段 <<<< … >>>>，实际 %d 段' % (path, len(got)))
              src, dst = got
              p = Path(path)
              if not p.is_file():
                  die('缺文件：' + path)
              text = p.read_text(encoding='utf-8')
              if src not in text:
                  die('没找到原文：' + path)
              p.write_text(text.replace(src, dst), encoding='utf-8')
              print('改了 ' + path)

          # ③ 删
          for path in pick(os.environ.get('DELETES', '')):
              subprocess.run(['git', 'rm', '-r', '-q', '--ignore-unmatch', path], check=True)
              print('rm ' + path)

          # ④ 自检：失败时把命令输出也打出来
          for check in pick(os.environ.get('CHECKS', '')):
              print('check: ' + check)
              r = subprocess.run(['bash', '-c', check], capture_output=True, text=True)
              if r.returncode != 0:
                  print(r.stdout, r.stderr)
                  die('自检没过：' + check)
              print('  ok')

          subprocess.run(['git', 'add', '-A'], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode == 0:
              die('清单没有产生任何改动')
          print(subprocess.run(['git', 'status', '--short'], capture_output=True, text=True).stdout)
          PY

      - name: 构建验证
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: 推到分支
        run: |
          set -euo pipefail
          B="${{ inputs.batch }}"
          git config user.name "reorg-bot"
          git config user.email "reorg-bot@users.noreply.github.com"
          git commit -m "reorg: $B"
          git push -f origin "HEAD:refs/heads/reorg-$B"
