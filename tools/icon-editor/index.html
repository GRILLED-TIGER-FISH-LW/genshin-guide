<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F4F1EA">
<title>图标字典编辑器</title>

<!-- ① 主题初始化：必须同步加载（不加 defer / async），否则首帧会闪 -->
<script src="../../shared/css/theme-init.js"></script>

<script>
(() => {
  const ts = Date.now();
  const withTs = (url) => url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + ts;

  const loadStyle = (href) => new Promise((resolve, reject) => {
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = withTs(href);
    l.onload = resolve;
    l.onerror = () => reject(new Error('加载失败：' + href));
    document.head.appendChild(l);
  });

  const loadScript = (src) => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = withTs(src);
    s.onload = resolve;
    s.onerror = () => reject(new Error('加载失败：' + src));
    document.head.appendChild(s);
  });

  window.__bootPromise = (async () => {
    await Promise.all([
      loadScript('../../shared/ui-icons.js'),
      loadScript('../../shared/css/dropdown.js'),
      loadStyle('../../shared/css/theme.css'),
      loadStyle('style.css')
    ]);
    await loadScript('../../shared/gi-icons/icon-loader.js');
    await loadScript('app.js');
  })();

  /* ② 加载失败兜底：任一资源 404 时给出可见提示，而不是永久白屏 */
  window.__bootPromise.catch((e) => {
    console.error('[Boot]', e);
    const bootEl = document.querySelector('.boot-loading');
    if (bootEl) {
      bootEl.style.whiteSpace = 'pre-wrap';
      bootEl.textContent = '载入失败：' + (e && e.message ? e.message : String(e)) +
        '\n请刷新重试；若持续失败，请把这条信息反馈给维护者。';
    }
  });
})();
</script>

<style>
  body { visibility: hidden; }
  body.ready { visibility: visible; }
  .boot-loading {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-base, #F4F1EA);
    color: var(--text-tertiary, #A69E95);
    font-size: 12px;
    font-family: var(--std-font, sans-serif);
    visibility: visible;
    padding: 24px; text-align: center; line-height: 1.6;
  }
  body.ready .boot-loading { display: none; }
</style>
</head>
<body>

<div class="boot-loading">正在载入图标字典编辑器…</div>

<header class="sticky-head">
  <div class="sticky-inner">

    <nav class="tab-bar" role="tablist" aria-label="图标分类">
      <button type="button" class="tab-btn is-active" data-tab="characters" role="tab" aria-selected="true">角色</button>
      <button type="button" class="tab-btn" data-tab="artifacts" role="tab" aria-selected="false">圣遗物</button>
      <button type="button" class="tab-btn" data-tab="weapons" role="tab" aria-selected="false">武器</button>
      <button type="button" class="tab-btn" data-tab="monsters" role="tab" aria-selected="false">怪物</button>
    </nav>

    <div class="search">
      <span class="search-icon" data-icon="search"></span>
      <input type="text" class="search-input" id="searchInput" placeholder="搜索名字或 key…" autocomplete="off" spellcheck="false">
      <button type="button" class="search-clear" id="searchClear" aria-label="清除搜索">
        <span data-icon="close"></span>
      </button>
    </div>

    <div class="actions-group">
      <button type="button" class="btn" id="btnSync">
        <span class="icon-slot" data-icon="import"></span><span class="btn-text">从 Amber 同步</span>
      </button>
      <button type="button" class="btn" id="btnPaste">
        <span class="icon-slot" data-icon="plus"></span><span class="btn-text">粘贴 URL</span>
      </button>
      <button type="button" class="btn" id="btnLoad">
        <span class="icon-slot" data-icon="import"></span><span class="btn-text">载入</span>
      </button>
      <button type="button" class="btn" id="btnExport">
        <span class="icon-slot" data-icon="export"></span><span class="btn-text">导出</span>
      </button>
      <button type="button" class="btn btn-danger" id="btnClear">
        <span class="icon-slot" data-icon="trash"></span><span class="btn-text">清空</span>
      </button>
    </div>

  </div>
</header>

<main class="main">
  <div class="entries" id="entries"></div>

  <div class="empty-state hidden" id="emptyTip">
    <span class="empty-icon" id="emptyIcon" data-icon="inbox"></span>
    <span id="emptyText">当前分类还没有条目<br>点上方按钮开始</span>
  </div>
</main>

<!-- 弹窗：确认框与粘贴框共用同一个外壳，靠 #pasteWrap 切换内容 -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">提示</div>
    <div class="modal-message" id="modalMessage"></div>
    <div id="pasteWrap" class="hidden">
      <textarea id="pasteArea" placeholder="https://api.lunaris.moe/data/assets/avataricon/UI_AvatarIcon_SkirkNew.webp"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" id="modalCancel">取消</button>
      <button type="button" class="modal-confirm" id="modalConfirm">确定</button>
    </div>
  </div>
</div>

<div class="status-bar" id="status">就绪</div>

</body>
</html>
