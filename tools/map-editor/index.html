<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F4F1EA">
<title>图标字典编辑器</title>

<script>
(function () {
  var ts = Date.now();
  function withTs(url) { return url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + ts; }
  function loadStyle(href) {
    return new Promise(function (resolve, reject) {
      var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = withTs(href);
      l.onload = resolve; l.onerror = function () { reject(new Error('加载失败：' + href)); };
      document.head.appendChild(l);
    });
  }
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script'); s.src = withTs(src);
      s.onload = resolve; s.onerror = function () { reject(new Error('加载失败：' + src)); };
      document.head.appendChild(s);
    });
  }
  window.__bootPromise = (async function () {
    await Promise.all([
      loadScript('../../shared/ui-icons.js'),
      loadStyle('../../shared/theme.css'),
      loadStyle('style.css')
    ]);
    await loadScript('../../shared/gi-icons/icon-loader.js');
    await loadScript('app.js');
  })();
})();
</script>

<style>
  body { visibility: hidden; }
  body.ready { visibility: visible; }
  .boot-loading {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-base, #F4F1EA); color: var(--text-tertiary, #A69E95);
    font-size: 13px; font-family: var(--std-font, sans-serif);
    visibility: visible;
  }
  body.ready .boot-loading { display: none; }
</style>
</head>
<body>

<div class="boot-loading">正在载入图标字典编辑器…</div>

<header class="sticky-head">
  <div class="sticky-inner">
    <nav class="tab-bar" role="tablist">
      <button class="tab-btn active" data-tab="characters">角色</button>
      <button class="tab-btn" data-tab="artifacts">圣遗物</button>
      <button class="tab-btn" data-tab="weapons">武器</button>
      <button class="tab-btn" data-tab="monsters">怪物</button>
    </nav>

    <div class="search-wrap">
      <span class="search-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path fill="currentColor" d="M229.66 218.34l-50.07-50.06a88.11 88.11 0 1 0-11.31 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72"/></svg>
      </span>
      <input type="text" class="search-input" id="searchInput" placeholder="搜索名字或 key…" autocomplete="off" spellcheck="false">
      <button type="button" class="search-clear" id="searchClear" aria-label="清除搜索">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path fill="currentColor" d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></svg>
      </button>
    </div>

    <div class="actions-group">
      <button type="button" class="ios-btn-fill" id="btnSync"><span class="btn-icon"></span>从 Amber 同步</button>
      <button type="button" id="btnPaste"><span class="btn-icon"></span>粘贴 URL</button>
      <button type="button" id="btnLoad"><span class="btn-icon"></span>载入</button>
      <button type="button" id="btnExport"><span class="btn-icon"></span>导出</button>
      <button type="button" class="btn-danger" id="btnClear"><span class="btn-icon"></span>清空</button>
    </div>
  </div>
</header>

<main class="main">
  <div class="entries" id="entries"></div>
  <div class="empty-tip" id="emptyTip">
    <span class="big-icon">📭</span>
    <span>当前分类还没有条目<br>点上方按钮开始</span>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-box">
    <div class="modal-title">粘贴图标链接</div>
    <div class="modal-hint">每行一个完整 URL，程序自动提取图标名并查 Amber 中文名。</div>
    <textarea id="pasteArea" placeholder="https://api.lunaris.moe/data/assets/avataricon/UI_AvatarIcon_SkirkNew.webp"></textarea>
    <div class="modal-actions">
      <button type="button" id="modalCancel">取消</button>
      <button type="button" class="ios-btn-fill" id="modalConfirm">解析并添加</button>
    </div>
  </div>
</div>

<div class="status-bar" id="status">就绪</div>

</body>
</html>
