<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<!-- =========================================================================
     图标字典编辑器 · index.html
     =========================================================================
     HTML 模块导航：
       【HTML 模块 0】 资源加载器
       【HTML 模块 1】 分类 Tab + 操作按钮
       【HTML 模块 2】 条目列表容器
       【HTML 模块 3】 粘贴 URL 弹窗
       【HTML 模块 4】 状态栏
     ========================================================================= -->
<head>
<!-- 【HTML 模块 0】资源加载器 -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F2EFEA">
<title>图标字典编辑器</title>

<script>
/* =========================================================================
 * 资源加载器
 * =========================================================================
 * 目的：绕过浏览器缓存，每次打开都拉最新版。
 * 加载顺序（分 3 批保证依赖）：
 *   1. ui-icons.js + theme.css + style.css
 *   2. icon-loader.js
 *   3. app.js
 * ========================================================================= */
(function () {
  var ts = Date.now();

  function withTs(url) {
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + ts;
  }

  function loadStyle(href) {
    return new Promise(function (resolve, reject) {
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = withTs(href);
      l.onload = resolve;
      l.onerror = function () { reject(new Error('加载失败：' + href)); };
      document.head.appendChild(l);
    });
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = withTs(src);
      s.onload = resolve;
      s.onerror = function () { reject(new Error('加载失败：' + src)); };
      document.head.appendChild(s);
    });
  }

  window.__bootPromise = (async function () {
    await Promise.all([
      loadScript('../../shared/ui-icons.js'),
      loadStyle('../../shared/theme.css'),
      loadStyle('style.css')
    ]);
    await loadScript('../../shared/gi-icons/icon-loader.js');
    await loadScript('app.js');
  })();
})();
</script>

<!-- 启动遮罩：加载完成前隐藏页面 -->
<style>
  body { visibility: hidden; }
  body.ready { visibility: visible; }
  .boot-loading {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F2EFEA;
    color: #9C958A;
    font-size: 13px;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    visibility: visible;
  }
  html[data-theme="dark"] .boot-loading { background: #121212; color: #8A8279; }
  body.ready .boot-loading { display: none; }
</style>
</head>
<body>

<!-- 启动遮罩 -->
<div class="boot-loading">正在载入图标字典编辑器…</div>

<!-- 【HTML 模块 1】分类 Tab + 操作按钮 -->
<div class="sticky-head">
  <div class="sticky-inner">
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="characters">角色</button>
      <button class="tab-btn" data-tab="artifacts">圣遗物</button>
      <button class="tab-btn" data-tab="weapons">武器</button>
      <button class="tab-btn" data-tab="monsters">怪物</button>
    </nav>

    <div class="actions-group">
      <div class="actions-row">
        <button type="button" class="ios-btn-fill" id="btnSync"><span class="btn-icon"></span>从 Amber 同步</button>
        <button type="button" id="btnPaste"><span class="btn-icon"></span>粘贴 URL</button>
      </div>
      <div class="actions-row">
        <button type="button" id="btnLoad"><span class="btn-icon"></span>载入</button>
        <button type="button" id="btnExport"><span class="btn-icon"></span>导出</button>
        <button type="button" class="btn-danger" id="btnClear"><span class="btn-icon"></span>清空</button>
      </div>
    </div>
  </div>
</div>

<!-- 【HTML 模块 2】条目列表容器 -->
<div class="main">
  <div class="entries" id="entries"></div>
  <div class="empty-tip" id="emptyTip" style="display:none;">
    <span class="big-icon">📭</span>
    当前分类还没有条目<br>
    点上方按钮开始
  </div>
</div>

<!-- 【HTML 模块 3】粘贴 URL 弹窗 -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-box">
    <div class="modal-title">粘贴图标链接</div>
    <div class="modal-hint">每行一个完整 URL，程序自动提取图标名并查 Amber 中文名。</div>
    <textarea id="pasteArea" placeholder="https://api.lunaris.moe/data/assets/avataricon/UI_AvatarIcon_SkirkNew.webp"></textarea>
    <div class="modal-actions">
      <button type="button" id="modalCancel">取消</button>
      <button type="button" class="ios-btn-fill" id="modalConfirm">解析并添加</button>
    </div>
  </div>
</div>

<!-- 【HTML 模块 4】状态栏 -->
<div class="status-bar" id="status">就绪</div>

</body>
</html>
