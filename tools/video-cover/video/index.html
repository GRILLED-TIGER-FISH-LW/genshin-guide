<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<title>视频封面</title>

<!-- ① 主题初始化：必须同步加载（不加 defer / async），否则首帧会闪 -->
<script src="../../../shared/css/theme-init.js?v=20261024"></script>

<script>
(() => {
  const ts = Date.now();
  const withTs = url => url + (url.includes('?') ? '&' : '?') + `t=${ts}`;
  const loadNode = (tag, attrs) => new Promise((resolve, reject) => {
    const el = document.createElement(tag);
    Object.assign(el, attrs);
    el.onload = resolve;
    el.onerror = () => reject(new Error(`加载失败：${attrs.href || attrs.src}`));
    document.head.appendChild(el);
  });
  const loadScript = src => loadNode('script', { src: withTs(src) });
  const loadStyle = href => loadNode('link', { rel: 'stylesheet', href: withTs(href) });

  window.__bootPromise = (async () => {
    await Promise.all([
      loadScript('../../../shared/ui-icons.js'),
      loadScript('../../../shared/css/dropdown.js'),
      loadStyle('../../../shared/css/theme.css'),
      loadStyle('style.css')
    ]);
    await Promise.all([
      loadScript('../../../shared/gi-icons/icon-loader.js'),
      loadScript('../../../shared/gi-icons/icon-dict.js')
    ]);
    await loadScript('app.js');
  })();

  /* ② 加载失败兜底：任一资源 404 时给出可见提示，而不是永久白屏 */
  window.__bootPromise.catch(e => {
    console.error('[Boot]', e);
    const bootEl = document.querySelector('.boot-loading');
    if (bootEl) {
      bootEl.style.whiteSpace = 'pre-wrap';
      bootEl.textContent = '载入失败：' + (e && e.message ? e.message : String(e)) +
        '\n请刷新重试；若持续失败，请把这条信息反馈给维护者。';
    }
  });
})();
</script>

<style>
  body { visibility: hidden; }
  body.ready { visibility: visible; }
  .boot-loading {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-base, #F4F1EA); color: var(--text-tertiary, #A69E95);
    font-size: 12px; font-family: var(--std-font, sans-serif);
    visibility: visible;
    padding: 24px; text-align: center; line-height: 1.6;
  }
  body.ready .boot-loading { display: none; }
</style>
</head>
<body>

<div class="boot-loading">正在载入视频封面…</div>

<div class="preview-sticky">
  <div class="preview-frame" id="previewFrame">
    <div id="svgPreviewHost"></div>
    <div class="float-toolbar" id="floatToolbar">
      <button type="button" class="float-btn" id="btnGuides" title="参考线" data-icon="guides"></button>
      <button type="button" class="float-btn" id="btnExportVideo" title="导出配置" data-icon="export"></button>
      <button type="button" class="float-btn" id="btnImportVideo" title="导入配置" data-icon="import"></button>
      <button type="button" class="float-btn float-btn-danger" id="btnClearVideo" title="清空" data-icon="trash"></button>
      <input type="file" id="importVideoInput" accept=".json" class="hidden">
    </div>
  </div>
</div>

<main class="form">
  <section>
    <div class="panel-header">字体（仅作用于导出图片）</div>
    <div class="panel">
      <div class="panel-row">
        <div class="font-label" id="labelVideoFont">默认系统字体</div>
        <div class="dropdown" id="fontDropdown">
          <button type="button" class="dropdown-trigger" id="btnFontPicker">
            <span class="icon-slot" data-icon="font"></span>
            <span class="dropdown-label">选择字体</span>
            <span class="dropdown-arrow">
              <span class="arrow-down" data-icon="chevronDown"></span>
              <span class="arrow-up" data-icon="chevronUp"></span>
            </span>
          </button>
          <div class="dropdown-panel" id="fontDropdownPanel"></div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="panel-header">游戏 Logo</div>
    <div class="panel">
      <div class="panel-row">
        <img id="logoThumb" class="thumb" alt="">
        <div class="dropdown" id="logoDropdown">
          <button type="button" class="dropdown-trigger">
            <span class="dropdown-label" id="logoDropdownLabel">原神</span>
            <span class="dropdown-arrow">
              <span class="arrow-down" data-icon="chevronDown"></span>
              <span class="arrow-up" data-icon="chevronUp"></span>
            </span>
          </button>
          <div class="dropdown-panel" id="logoDropdownPanel"></div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="panel-header">画布背景</div>
    <div class="panel">
      <div class="panel-row">
        <img id="bgThumb" class="thumb" alt="" onclick="document.getElementById('bgFile').click()">
        <div class="flex-1">
          <div class="upload-text" id="bgFileName">点击上传背景图</div>
        </div>
        <input type="file" id="bgFile" accept="image/*" class="hidden">
      </div>
      <div class="slider-group row-pad">
        <div class="slider-label"><span>背景亮度</span></div>
        <div class="slider-row">
          <input type="range" id="midBrightness" min="-100" max="100" value="-50" oninput="App.syncVal('midBrightness', this.value)">
          <div class="number-box"><input type="number" id="midBrightnessInput" min="-100" max="100" value="-50" oninput="App.syncVal('midBrightness', this.value)"><span class="number-unit">%</span></div>
        </div>
      </div>
      <div class="slider-group row-pad">
        <div class="slider-label"><span>背景模糊</span></div>
        <div class="slider-row">
          <input type="range" id="midBlur" min="0" max="100" value="50" oninput="App.syncVal('midBlur', this.value)">
          <div class="number-box"><input type="number" id="midBlurInput" min="0" max="100" value="50" oninput="App.syncVal('midBlur', this.value)"><span class="number-unit">%</span></div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="panel-header">攻略模式</div>
    <div class="tab-bar">
      <button type="button" class="tab-btn is-active" data-type="character" onclick="App.setGuideType('character')">角色攻略</button>
      <button type="button" class="tab-btn" data-type="boss" onclick="App.setGuideType('boss')">Boss攻略</button>
      <button type="button" class="tab-btn" data-type="custom" onclick="App.setGuideType('custom')">自定义</button>
    </div>

    <div id="characterPanel" class="panel">
      <div class="slider-group row-pad">
        <div class="slider-label"><span>立绘 X 位置</span></div>
        <div class="slider-row">
          <input type="range" id="characterX" min="0" max="3840" value="2650" oninput="App.syncVal('characterX', this.value)">
          <div class="number-box"><input type="number" id="characterXInput" min="0" max="3840" value="2650" oninput="App.syncVal('characterX', this.value)"><span class="number-unit">px</span></div>
        </div>
      </div>
    </div>

    <div id="customPanel" class="panel hidden">
      <div class="panel-row custom-head">
        <span class="custom-head-label">浮动素材</span>
        <button type="button" class="btn-icon" onclick="App.addFloat()">
          <span class="icon-slot" data-icon="plus"></span>
        </button>
      </div>
      <div id="floatList" class="float-list row-pad"></div>
    </div>
  </section>

  <section id="capSection">
    <div class="panel-header">胶囊标签</div>
    <div class="panel">
      <label class="field row-pad">
        <span class="field-label">标签文字</span>
        <input type="text" id="capTextInput" placeholder="如：攻略 / 速刷" oninput="App.set('capText', this.value)">
      </label>
      <div class="slider-group row-pad">
        <div class="slider-label"><span>文字亮度</span></div>
        <div class="slider-row">
          <input type="range" id="capTextBrightness" min="0" max="200" value="100" oninput="App.syncVal('capTextBrightness', this.value)">
          <div class="number-box"><input type="number" id="capTextBrightnessInput" min="0" max="200" value="100" oninput="App.syncVal('capTextBrightness', this.value)"><span class="number-unit">%</span></div>
        </div>
      </div>
    </div>
  </section>

  <section id="mainSection">
    <div class="panel-header">主标题</div>
    <div class="panel">
      <label class="field row-pad">
        <textarea id="mainTextInput" rows="2" placeholder="输入主标题（支持回车两行）" oninput="App.set('mainText', this.value)"></textarea>
      </label>
    </div>
  </section>

  <section>
    <div class="panel-header">副标题</div>
    <div class="panel">
      <label class="field row-pad">
        <span class="field-label" id="sub1Label">第一行</span>
        <input type="text" id="sub1Input" placeholder="第一行文字" oninput="App.onSub1Input(this.value)" onblur="App.onSub1Blur(this.value)">
      </label>
      <div class="field row-pad hidden" id="sub1SizeRow">
        <span class="field-label">字号</span>
        <div class="dropdown" id="sub1SizeDropdown">
          <button type="button" class="dropdown-trigger">
            <span class="dropdown-label" id="sub1SizeLabel">小字号</span>
            <span class="dropdown-arrow">
              <span class="arrow-down" data-icon="chevronDown"></span>
              <span class="arrow-up" data-icon="chevronUp"></span>
            </span>
          </button>
          <div class="dropdown-panel">
            <button type="button" class="dropdown-item is-active" data-value="200" data-target="sub1">小字号</button>
            <button type="button" class="dropdown-item" data-value="250" data-target="sub1">大字号</button>
          </div>
        </div>
      </div>
      <label class="field row-pad">
        <span class="field-label" id="sub2Label">第二行</span>
        <input type="text" id="sub2Input" placeholder="第二行文字" oninput="App.onSub2Input(this.value)" onblur="App.onSub2Blur(this.value)">
      </label>
      <div class="field row-pad hidden" id="sub2SizeRow">
        <span class="field-label">字号</span>
        <div class="dropdown" id="sub2SizeDropdown">
          <button type="button" class="dropdown-trigger">
            <span class="dropdown-label" id="sub2SizeLabel">大字号</span>
            <span class="dropdown-arrow">
              <span class="arrow-down" data-icon="chevronDown"></span>
              <span class="arrow-up" data-icon="chevronUp"></span>
            </span>
          </button>
          <div class="dropdown-panel">
            <button type="button" class="dropdown-item" data-value="200" data-target="sub2">小字号</button>
            <button type="button" class="dropdown-item is-active" data-value="250" data-target="sub2">大字号</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<button type="button" class="export-btn" onclick="App.exportPNG()">导出图片</button>

<div class="toast-container" id="toastContainer"></div>
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">提示</div>
    <div class="modal-message" id="modalMessage"></div>
    <div class="modal-actions">
      <button type="button" id="modalCancel">取消</button>
      <button type="button" class="modal-confirm" id="modalConfirm">确定</button>
    </div>
  </div>
</div>

</body>
</html>
