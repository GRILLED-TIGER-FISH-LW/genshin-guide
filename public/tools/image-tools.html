<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>图片处理整合工具</title>
<style>
:root {
  --bg-base: #F2EFEA; --bg-surface: #FFFFFF; --bg-surface-2: #FAF8F5;
  --bg-sunken: #EBE7E0; --bg-hover: #F5F2ED;
  --border-subtle: #EBE6DF; --border-default: #DDD6CC; --border-strong: #C6BEB2;
  --text-primary: #1F1D1A; --text-secondary: #6B655C; --text-tertiary: #9C958A;
  --accent: #8B7355; --accent-dark: #75604A;
  --ios-blue: #0A84FF; --danger: #DC4C3E; --danger-bg: #FCEAE8; --danger-hover: #F8DCD8;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --ctl-h: 38px;
  --shadow-btn: 0 1px 2px rgba(31,29,26,.04);
  --shadow-btn-hover: 0 2px 6px rgba(31,29,26,.08);
  --shadow-card: 0 1px 2px rgba(31,29,26,.03);
  --std-font: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; height: 100dvh; }
html, body, input, button, select, textarea {
  font-family: var(--std-font); font-synthesis: none;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
body {
  background: var(--bg-base); color: var(--text-primary); font-size: 13px;
  overflow: hidden; display: flex; flex-direction: column; letter-spacing: -0.2px;
}
.icon { width: 1em; height: 1em; fill: currentColor; flex-shrink: 0; display: block; }

.app-navbar {
  flex: none; height: 52px; padding: 0 14px;
  background: rgba(242,239,234,.88);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 40;
}
.navbar-left { display: flex; align-items: center; gap: 10px; }
.btn-sidebar-toggle {
  width: 34px; height: 34px; background: var(--bg-surface);
  border: 1px solid var(--border-default); border-radius: var(--radius-sm);
  color: var(--text-primary); font-size: 16px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: all .15s; box-shadow: var(--shadow-btn);
}
.btn-sidebar-toggle:hover { background: var(--bg-hover); }
.btn-sidebar-toggle:active { transform: scale(.94); }
.btn-sidebar-toggle .icon { width: 18px; height: 18px; }
.nav-title {
  font-size: 15px; font-weight: 600; color: var(--text-primary);
  display: inline-flex; align-items: center;
}
.nav-title .icon { width: 16px; height: 16px; color: var(--accent); }
#currentToolTitle { display: inline-flex; align-items: center; gap: 6px; }

.sidebar-backdrop {
  position: fixed; inset: 0; background: rgba(31,29,26,.35);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  z-index: 90; opacity: 0; pointer-events: none;
  transition: opacity .25s cubic-bezier(.16,1,.3,1);
}
.sidebar-backdrop.active { opacity: 1; pointer-events: auto; }
.sidebar-drawer {
  position: fixed; top: 0; bottom: 0; left: 0;
  width: 270px; max-width: 85vw;
  background: rgba(242,239,234,.96);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-right: 1px solid var(--border-subtle);
  z-index: 100; display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform .28s cubic-bezier(.16,1,.3,1);
  box-shadow: 12px 0 32px rgba(31,29,26,.12);
}
.sidebar-drawer.open { transform: translateX(0); }
.sidebar-header {
  padding: 16px 14px 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border-subtle);
}
.sidebar-header h3 { font-size: 15px; font-weight: 600; color: var(--text-primary); }
.sidebar-menu {
  padding: 12px 10px; display: flex; flex-direction: column; gap: 4px;
  overflow-y: auto; flex: 1;
}
.sidebar-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 12px; border-radius: var(--radius-md);
  background: transparent; border: 1px solid transparent;
  color: var(--text-secondary); font-size: 14px; font-weight: 500;
  cursor: pointer; width: 100%; text-align: left; transition: all .15s;
}
.sidebar-item .item-icon {
  width: 20px; height: 20px; display: inline-flex;
  align-items: center; justify-content: center; flex-shrink: 0;
}
.sidebar-item .item-icon .icon { width: 20px; height: 20px; }
.sidebar-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.sidebar-item.active {
  background: var(--bg-surface); border-color: var(--border-subtle);
  color: var(--text-primary); font-weight: 600;
  box-shadow: var(--shadow-card); position: relative;
}
.sidebar-item.active::before {
  content: ''; position: absolute; left: 4px; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 20px; border-radius: 2px; background: var(--accent);
}
.sidebar-item.active .item-icon { color: var(--accent); }

.frame-container { flex: 1; position: relative; overflow: hidden; background: var(--bg-base); }
.frame-view { position: absolute; inset: 0; display: none; }
.frame-view iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--bg-base); }
.loading-mask {
  position: absolute; inset: 0; z-index: 20; display: none;
  align-items: center; justify-content: center; gap: 10px;
  background: rgba(242,239,234,.85);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  color: var(--text-secondary); font-size: 13px;
}
.loading-mask.show { display: flex; }
.ios-spinner {
  width: 22px; height: 22px;
  border: 2.5px solid var(--border-subtle); border-top-color: var(--accent);
  border-radius: 50%; animation: iosSpin .75s linear infinite;
}
@keyframes iosSpin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="app-navbar">
  <div class="navbar-left">
    <button type="button" class="btn-sidebar-toggle" onclick="toggleSidebar(true)" id="btnMenu" title="切换功能菜单"></button>
    <div class="nav-title"><span id="currentToolTitle">图片处理整合工具</span></div>
  </div>
</header>

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>

<aside class="sidebar-drawer" id="sidebarDrawer">
  <div class="sidebar-header">
    <h3>工具导航</h3>
    <button class="btn-sidebar-toggle" style="width:28px;height:28px;" onclick="toggleSidebar(false)" id="btnClose" title="关闭侧边栏"></button>
  </div>
  <nav class="sidebar-menu" id="sidebarMenuList"></nav>
</aside>

<main class="frame-container">
  <div class="loading-mask" id="loadingMask">
    <div class="ios-spinner"></div>
    <span>正在载入模块…</span>
  </div>
  <div class="frame-view" data-tool="background"></div>
  <div class="frame-view" data-tool="blend"></div>
  <div class="frame-view" data-tool="overlay"></div>
  <div class="frame-view" data-tool="collage"></div>
  <div class="frame-view" data-tool="weapon"></div>
  <div class="frame-view" data-tool="achievement"></div>
</main>

/* =========================================================================
 * 【模块 2】SVG 正方形裁切
 * ========================================================================= */
function tightenSvgToSquareViewBox(svgString) {
  const ns = 'http://www.w3.org/2000/svg';
  const host = document.createElementNS(ns, 'svg');
  host.style.position = 'absolute';
  host.style.left = '-9999px';
  host.style.top = '-9999px';
  host.style.width = '1px'; host.style.height = '1px';
  host.style.visibility = 'hidden'; host.setAttribute('aria-hidden', 'true');
  document.body.appendChild(host);
  const wrap = document.createElementNS(ns, 'svg');
  wrap.innerHTML = svgString;
  host.appendChild(wrap);
  const paths = wrap.querySelectorAll('path');
  if (!paths.length) { host.remove(); return svgString; }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  paths.forEach(p => {
    let b;
    try { b = p.getBBox(); } catch (e) { return; }
    if (!b || (b.width === 0 && b.height === 0)) return;
    minX = Math.min(minX, b.x); minY = Math.min(minY, b.y);
    maxX = Math.max(maxX, b.x + b.width); maxY = Math.max(maxY, b.y + b.height);
  });
  host.remove();
  if (!isFinite(minX) || !isFinite(minY)) return svgString;
  const w = maxX - minX, h = maxY - minY, side = Math.max(w, h);
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const nx = cx - side / 2, ny = cy - side / 2;
  const fmt = n => +n.toFixed(4);
  return svgString.replace(/viewBox="[^"]*"/, `viewBox="${fmt(nx)} ${fmt(ny)} ${fmt(side)} ${fmt(side)}"`);
}
function tightenAllIconViewBoxes() {
  Object.keys(ICONS).forEach(k => { ICONS[k] = tightenSvgToSquareViewBox(ICONS[k]); });
  Object.keys(ELEMENT_ICONS).forEach(k => { ELEMENT_ICONS[k] = tightenSvgToSquareViewBox(ELEMENT_ICONS[k]); });
}

const SHARED_CSS = `
:root {
  --bg-base: #F2EFEA; --bg-surface: #FFFFFF; --bg-surface-2: #FAF8F5;
  --bg-sunken: #EBE7E0; --bg-hover: #F5F2ED;
  --border-subtle: #EBE6DF; --border-default: #DDD6CC; --border-strong: #C6BEB2;
  --text-primary: #1F1D1A; --text-secondary: #6B655C; --text-tertiary: #9C958A;
  --accent: #8B7355; --accent-dark: #75604A;
  --ios-blue: #0A84FF; --danger: #DC4C3E; --danger-bg: #FCEAE8; --danger-hover: #F8DCD8;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --ctl-h: 38px;
  --shadow-btn: 0 1px 2px rgba(31,29,26,.04);
  --shadow-btn-hover: 0 2px 6px rgba(31,29,26,.08);
  --shadow-card: 0 1px 2px rgba(31,29,26,.03);
  --std-font: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg-base); color: var(--text-primary);
  font-family: var(--std-font); font-size: 13px;
  padding: 0 14px 40px; letter-spacing: -0.2px;
  -webkit-font-smoothing: antialiased;
}
.icon { width: 1em; height: 1em; fill: currentColor; flex-shrink: 0; display: block; }
.app { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.ios-section-header {
  font-size: 12px; font-weight: 600; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 0.5px; padding: 0 8px 6px;
  display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap;
}
.ios-group {
  background: var(--bg-surface); border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: var(--shadow-card);
}
.ios-row {
  padding: 10px; display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--border-subtle);
}
.ios-row:last-child { border-bottom: 0; }
.field-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; padding: 10px; }
.field-grid.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
@media (max-width: 640px) { .field-grid, .field-grid.three { grid-template-columns: 1fr; } }

label.ios-field { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-secondary); font-weight: 500; }
input[type="text"], input[type="number"], select {
  width: 100%; height: var(--ctl-h); background: var(--bg-sunken);
  border: 1px solid var(--border-default); border-radius: var(--radius-sm);
  color: var(--text-primary); font-size: 13px; font-family: inherit; padding: 0 10px;
  outline: none; transition: background .15s, border-color .15s, box-shadow .15s;
}
input[type="text"]:focus, input[type="number"]:focus, select:focus {
  background: var(--bg-surface); border-color: var(--ios-blue);
  box-shadow: 0 0 0 3px rgba(10,132,255,.15);
}
input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }

button, .file-btn {
  font-family: inherit; border: 1px solid var(--border-default); border-radius: var(--radius-sm);
  height: var(--ctl-h); padding: 0 14px; font-size: 13px; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  transition: all .18s cubic-bezier(.4,0,.2,1); white-space: nowrap; flex-shrink: 0;
  background: var(--bg-surface); color: var(--text-primary); box-shadow: var(--shadow-btn);
  -webkit-appearance: none; appearance: none; user-select: none;
}
button:hover:not(:disabled), .file-btn:hover { background: var(--bg-hover); box-shadow: var(--shadow-btn-hover); }
button:active:not(:disabled), .file-btn:active { transform: scale(.97); }
button:disabled { opacity: .35; cursor: not-allowed; }
.btn-sm { height: 32px; padding: 0 10px; font-size: 12px; gap: 4px; }
.btn-xs { height: 26px; padding: 0 8px; font-size: 11px; gap: 4px; border-radius: var(--radius-sm); font-weight: 500; }
.btn-danger { background: var(--danger-bg); color: var(--danger); border-color: rgba(220,76,62,.2); }
.btn-danger:hover:not(:disabled) { background: var(--danger-hover); }
.ios-btn-fill { background: var(--text-primary); border-color: var(--text-primary); color: #fff; box-shadow: 0 2px 6px rgba(31,29,26,.15); }
.ios-btn-fill:hover { background: var(--accent-dark); }
.ios-btn-fill.btn-xs { height: 26px; padding: 0 8px; font-size: 11px; }
.btn-primary {
  background: var(--text-primary); color: #fff; border: 1px solid var(--text-primary);
  width: 100%; min-height: 46px; font-size: 15px; font-weight: 600;
  border-radius: var(--radius-lg); box-shadow: 0 4px 16px rgba(31,29,26,.18);
}
.btn-primary:hover:not(:disabled) { background: var(--accent-dark); }
.file-btn input[type="file"] { display: none !important; }

.clickable-thumb {
  width: var(--ctl-h); height: var(--ctl-h); border-radius: var(--radius-sm);
  background: var(--bg-sunken); border: 1px solid var(--border-default);
  object-fit: cover; flex-shrink: 0; cursor: pointer;
  transition: transform .12s, filter .12s, border-color .12s;
}
.clickable-thumb:hover { filter: brightness(.94); border-color: var(--accent); }
.clickable-thumb:active { transform: scale(.92); }

.upload-row {
  display: flex; align-items: center; gap: 8px; padding: 10px;
  border-bottom: 1px solid var(--border-subtle);
}
.upload-row:last-child { border-bottom: 0; }
.upload-label { flex: 1; font-size: 13px; font-weight: 500; color: var(--text-primary); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.seg-control {
  display: flex; background: var(--bg-sunken); padding: 3px;
  border-radius: var(--radius-md); gap: 2px; border: 1px solid var(--border-subtle);
  overflow-x: auto; scrollbar-width: none;
}
.seg-control::-webkit-scrollbar { display: none; }
.seg-btn {
  flex: 1; min-width: 68px; height: 32px;
  background: transparent; border: 0; border-radius: 9px;
  color: var(--text-secondary); font-size: 13px; font-weight: 500;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  white-space: nowrap; transition: all .2s cubic-bezier(.16,1,.3,1); padding: 0 8px;
}
.seg-btn:hover { color: var(--text-primary); }
.seg-btn.active {
  background: var(--bg-surface); color: var(--text-primary);
  font-weight: 600; box-shadow: 0 1px 3px rgba(31,29,26,.08);
}

.preview-sticky-wrap {
  position: sticky; top: 0; z-index: 60;
  background: rgba(242,239,234,.92);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  padding: 10px 0 8px;
  margin: 0 -14px; padding-left: 14px; padding-right: 14px;
  border-bottom: 1px solid var(--border-subtle);
}
.preview-card {
  background: var(--bg-surface); border: 1px solid var(--border-subtle);

}
.preview-stage {
  display: flex; align-items: center; justify-content: center;
  width: 100%; min-height: 120px; overflow: hidden; padding: 0; position: relative;
}
.preview-frame {
  border-radius: var(--radius-md); overflow: hidden;
  border: 1px solid var(--border-default);
  position: relative; background: #1c1c22;
  display: flex; align-items: center; justify-content: center;
  box-sizing: border-box; transition: width .15s ease, height .15s ease;
}
.preview-frame canvas, .preview-frame svg {
  display: block !important; width: 100% !important; height: 100% !important;
  border: 0 !important; margin: 0 !important; padding: 0 !important;
  object-fit: fill !important; touch-action: none;
}

.slider-row { display: flex; align-items: center; gap: 10px; width: 100%; }
.num-box {
  display: inline-flex; align-items: center; background: var(--bg-sunken);
  border: 1px solid var(--border-default); border-radius: var(--radius-sm);
  padding: 0 8px; height: 32px; width: 80px; flex-shrink: 0;
  transition: border-color .15s, background .15s;
}
.num-box:focus-within { border-color: var(--ios-blue); background: var(--bg-surface); box-shadow: 0 0 0 3px rgba(10,132,255,.15); }
.num-box input[type="number"] {

.control-header {

.swatch-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px; }

 * ========================================================================= */
const SHARED_JS = `
function getFormattedTimestamp() {
  var now = new Date();
  var y = now.getFullYear();
  var m = String(now.getMonth() + 1).padStart(2, '0');
  var d = String(now.getDate()).padStart(2, '0');
  var hh = String(now.getHours()).padStart(2, '0');
  var mm = String(now.getMinutes()).padStart(2, '0');
  return y + m + d + '_' + hh + mm;
}

function updateFrameAspect(w, h) {
  var frame = document.getElementById('previewFrame');
  var stage = document.getElementById('previewStage');
  if (!frame || !stage || !w || !h) return;
  var availW = stage.clientWidth || 360;
  var availH = Math.min(window.innerHeight * 0.36, 320);
  var r = w / h;
  var tw, th;
  if (availW / availH > r) { th = availH; tw = th * r; }
  else { tw = availW; th = tw / r; }
  frame.style.width = Math.round(tw) + 'px';
  frame.style.height = Math.round(th) + 'px';
}

function hexToHsl(hex) {
  var num = parseInt(hex.replace('#',''), 16);
  var r = ((num >> 16) & 0xFF) / 255, g = ((num >> 8) & 0xFF) / 255, b = (num & 0xFF) / 255;
  var max = Math.max(r, g, b), min = Math.min(r, g, b);
  var h = 0, s = 0, l = (max + min) / 2;
  if (max !== min) {
    var dd = max - min;
    s = l > 0.5 ? dd / (2 - max - min) : dd / (max + min);
    if (max === r) h = (g - b) / dd + (g < b ? 6 : 0);
    else if (max === g) h = (b - r) / dd + 2;
    else h = (r - g) / dd + 4;
    h /= 6;
  }
  return [h * 360, s * 100, l * 100];
}
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  var c = (1 - Math.abs(2 * l - 1)) * s;
  var x = c * (1 - Math.abs((h / 60) % 2 - 1));
  var m = l - c / 2;
  var r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return '#' + [r + m, g + m, b + m].map(function(v) { return Math.max(0, Math.min(255, Math.round(v * 255))).toString(16).padStart(2, '0'); }).join('');
}
function darkenColorPercent(hex, percent) {
  var hsl = hexToHsl(hex);
  return hslToHex(hsl[0], hsl[1], Math.max(0, Math.min(100, hsl[2] * (1 - percent))));
}

function loadImg(file) {
  return new Promise(function(res, rej) {
    var u = URL.createObjectURL(file), im = new Image();
    im.onload = function() { res(im); };
    im.onerror = rej;
    im.src = u;
  });
}
function readFile(file) {
  return new Promise(function(r) {
    if (!file) return r('');
    var fr = new FileReader();
    fr.onload = function(e) { r(e.target.result); };
    fr.readAsDataURL(file);
  });
}
function getLayerBounds(layers) {
  var maxW = 0, maxH = 0;
  for (var i = 0; i < layers.length; i++) {
    var l = layers[i];
    if (l.origW > maxW) maxW = l.origW;
    if (l.origH > maxH) maxH = l.origH;
  }
  return { maxW: maxW, maxH: maxH };
}
function triggerUpload(id) {
  var el = document.getElementById(id);
  if (el) el.click();
}
function downloadBlob(blob, filename) {
  var a = document.createElement('a');
  var url = URL.createObjectURL(blob);
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function() { URL.revokeObjectURL(url); }, 30000);
}
function placeholder(label) {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><text x="100" y="112" font-size="52" text-anchor="middle" fill="#999" font-family="sans-serif">' + label + '</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function resetThumb(thumbId, labelId, text) {
  var thumb = document.getElementById(thumbId);
  var label = document.getElementById(labelId);
  if (thumb) thumb.removeAttribute('src');
  if (label) label.textContent = text;
}
function setThumb(thumbId, labelId, src, text) {
  var thumb = document.getElementById(thumbId);
  var label = document.getElementById(labelId);
  if (thumb) thumb.src = src;
  if (label) label.textContent = text;
}

/* —— rAF 合并：同一帧内的多次事件合并为一次 —— */
var __rafJobs = {};
var __rafScheduled = false;
function scheduleRaf(key, job) {
  __rafJobs[key] = job;
  if (__rafScheduled) return;
  __rafScheduled = true;
  requestAnimationFrame(function() {
    __rafScheduled = false;
    var jobs = __rafJobs;
    __rafJobs = {};
    for (var k in jobs) { try { jobs[k](); } catch (e) {} }
  });
}
`;

/* syncVal：rAF 低分辨率 + debounce 全分辨率 */
'function syncVal(key, val) {\n' +

'  if (key === \'split\') state.split = num / 100;\n' +
'  else if (key === \'feather\') state.feather = num / 100;\n' +
'  else if (key === \'leftZoom\') state.leftZoom = num / 100;\n' +
'  else if (key === \'rightZoom\') state.rightZoom = num / 100;\n' +
'  else if (key === \'leftY\') state.leftY = num / 100;\n' +
'  else if (key === \'rightY\') state.rightY = num / 100;\n' +
'  var slider = document.getElementById(key);\n' +
'  var input = document.getElementById(key + \'Input\');\n' +
'  if (document.activeElement !== slider && slider) slider.value = num;\n' +
'  if (document.activeElement !== input && input) input.value = num;\n' +
'  scheduleRender();\n' +
'}\n' +

/* scheduleRender：rAF 低分辨率 + debounce 全分辨率 */
'function scheduleRender(immediate) {\n' +
'  if (immediate) {\n' +
'    if (fullResTimer) { clearTimeout(fullResTimer); fullResTimer = null; }\n' +
'    render(cv, 1);\n' +
'    return;\n' +
'  }\n' +
'  scheduleRaf(\'blend\', function() { render(cv, PREVIEW_SCALE); });\n' +
'  if (fullResTimer) clearTimeout(fullResTimer);\n' +
'  fullResTimer = setTimeout(function() {\n' +
'    fullResTimer = null;\n' +
'    render(cv, 1);\n' +
'  }, 200);\n' +
'}\n' +

'function smoothstep(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }\n' +
'function drawFitted(c, img, w, h, mode, zoom, offY) {\n' +
'  var scale = mode === \'contain\' ? Math.min(w/img.width, h/img.height) : Math.max(w/img.width, h/img.height);\n' +
'  if (mode === \'stretch\') scale = 1;\n' +
'  var dw = (mode === \'stretch\' ? w : img.width * scale) * zoom, dh = (mode === \'stretch\' ? h : img.height * scale) * zoom;\n' +
'  var dx = (w - dw) / 2, dy = (h - dh) / 2 + offY * h;\n' +
'  c.drawImage(img, dx, dy, dw, dh);\n' +
'}\n' +

/* render 支持 scale 参数 */
'function render(targetCv, scale) {\n' +
'  scale = scale || 1;\n' +
'  targetCv = targetCv || cv;\n' +
'  var base = state.left || state.right;\n' +
'  var baseW = base ? base.width : 1280, baseH = base ? base.height : 720;\n' +
'  var w = Math.max(1, Math.round(baseW * scale));\n' +
'  var h = Math.max(1, Math.round(baseH * scale));\n' +
'  targetCv.width = w; targetCv.height = h;\n' +
'  if (targetCv === cv) updateFrameAspect(baseW, baseH);\n' +
'  var tCtx = targetCv.getContext(\'2d\', { willReadFrequently: true });\n' +
'  if (!state.left && !state.right) {\n' +
'    tCtx.fillStyle = \'#1c1c22\'; tCtx.fillRect(0, 0, w, h);\n' +
'    tCtx.fillStyle = \'#999\'; tCtx.font = \'20px sans-serif\'; tCtx.textAlign = \'center\';\n' +
'    tCtx.fillText(\'请上传左/右两张图片进行合成\', w / 2, h / 2);\n' +

'    return;\n' +
'  }\n' +
'  document.getElementById(\'status\').textContent = baseW + \' × \' + baseH + \' px\';\n' +
'  var lcv = document.createElement(\'canvas\'), rcv = document.createElement(\'canvas\');\n' +
'  lcv.width = rcv.width = w; lcv.height = rcv.height = h;\n' +
'  var lct = lcv.getContext(\'2d\'), rct = rcv.getContext(\'2d\');\n' +
'  if (state.left) drawFitted(lct, state.left, w, h, state.fitMode, state.leftZoom, state.leftY);\n' +
'  if (state.right) drawFitted(rct, state.right, w, h, state.fitMode, state.rightZoom, state.rightY);\n' +
'  var ld = lct.getImageData(0,0,w,h), rd = rct.getImageData(0,0,w,h);\n' +
'  var res = tCtx.createImageData(w,h);\n' +
'  var sX = state.split * w, fW = state.feather * w;\n' +
'  var start = sX - fW / 2, end = sX + fW / 2;\n' +
'  for (var y = 0; y < h; y++) {\n' +
'    var row = y * w * 4;\n' +
'    for (var x = 0; x < w; x++) {\n' +
'      var i = row + x * 4;\n' +
'      var rw = fW <= 0 ? (x >= sX ? 1 : 0) : (x <= start ? 0 : (x >= end ? 1 : smoothstep((x - start) / fW)));\n' +
'      var lw = 1 - rw;\n' +
'      var la = ld.data[i+3] / 255, ra = rd.data[i+3] / 255;\n' +
'      var outA = la * lw + ra * rw;\n' +
'      if (outA > 0) {\n' +
'        res.data[i] = (ld.data[i]*la*lw + rd.data[i]*ra*rw) / outA;\n' +
'        res.data[i+1] = (ld.data[i+1]*la*lw + rd.data[i+1]*ra*rw) / outA;\n' +
'        res.data[i+2] = (ld.data[i+2]*la*lw + rd.data[i+2]*ra*rw) / outA;\n' +
'        res.data[i+3] = outA * 255;\n' +
'      }\n' +
'    }\n' +
'  }\n' +
'  tCtx.putImageData(res, 0, 0);\n' +
'}\n' +
'document.getElementById(\'leftFile\').addEventListener(\'change\', async function(e){\n' +
'  if (!e.target.files[0]) return;\n' +
'  var f = e.target.files[0]; state.leftName = f.name.replace(/\\.[^.]+$/, \'\');\n' +
'  state.left = await loadImg(f);\n' +

'});\n' +
'document.getElementById(\'rightFile\').addEventListener(\'change\', async function(e){\n' +
'  if (!e.target.files[0]) return;\n' +
'  var f = e.target.files[0]; state.rightName = f.name.replace(/\\.[^.]+$/, \'\');\n' +
'  state.right = await loadImg(f);\n' +
'  setThumb(\'thumbRight\', \'labelRight\', state.right.src, f.name);\n' +
'  scheduleRender(true); e.target.value = \'\';\n' +
'});\n' +
'window.__clearHook = function(id) {\n' +
'  if (id === \'leftFile\') { state.left = null; state.leftName = \'\'; scheduleRender(true); }\n' +
'  if (id === \'rightFile\') { state.right = null; state.rightName = \'\'; scheduleRender(true); }\n' +
'};\n' +
'function exportBlendPNG() {\n' +

'render(cv, 1);\n' +

TOOL_HTMLS.overlay = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>对位裁切</title><style>' + SHARED_CSS + '</style></head><body>' +

'</div>' +
'<script>' + SHARED_JS + '\n' +
'var cv = document.getElementById(\'canvas\'), ctx = cv.getContext(\'2d\');\n' +
'var state = { ref: null, overlay: null, refName: \'\', overlayName: \'\', opacity: 0.65, zoom: 1, x: 0, y: 0, showGrid: true };\n' +

'function updateStatus() {\n' +

'}\n' +
'function syncZoomUI() { var v = Math.round(state.zoom*100); var s = document.getElementById(\'zoom\'), i = document.getElementById(\'zoomInput\'); if (document.activeElement !== s) s.value = v; if (document.activeElement !== i) i.value = v; }\n' +

'}\n' +

'function render() {\n' +
'  var w = state.ref ? state.ref.width : 1280, h = state.ref ? state.ref.height : 720;\n' +

'});\n' +
'document.getElementById(\'overlayFile\').addEventListener(\'change\', async function(e){\n' +

'};\n' +
'document.getElementById(\'gridBtn\').onclick = function() { state.showGrid = !state.showGrid; this.textContent = state.showGrid ? \'隐藏辅助网格\' : \'显示辅助网格\'; render(); };\n' +
'document.getElementById(\'centerBtn\').onclick = function() { state.x = 0; state.y = 0; syncPosUI(); render(); };\n' +

'}\n' +
'cv.onpointerup = handlePointerEnd; cv.onpointercancel = handlePointerEnd;\n' +

'</div>' +
'<script>' + SHARED_JS + '\n' +
'var ICON_UP = ' + JSON.stringify(ICONS.up) + ';\n' +

'var ICON_TRASH = ' + JSON.stringify(ICONS.trash) + ';\n' +
'var cv = document.getElementById(\'cv\'); var ctx = cv.getContext(\'2d\');\n' +
'var RATIO_MAP = { \'1:1\':1, \'16:9\':16/9, \'4:3\':4/3, \'3:2\':3/2, \'2:1\':2, \'1:2\':1/2, \'2:3\':2/3, \'3:4\':3/4, \'9:16\':9/16 };\n' +

'function scheduleRender() { scheduleRaf(\'collage\', render); }\n' +
'function setRatio(rKey, btn) {\n' +

'  if (btn) btn.classList.add(\'active\');\n' +
'  recalcCanvasDimensions(); render();\n' +
'}\n' +
'function switchBgMode(mode) { state.bgType = mode; document.getElementById(\'hexContainer\').style.display = mode === \'color\' ? \'block\' : \'none\'; render(); }\n' +

'function syncHexFromInput(v) { var code = v.trim(); if (!code.startsWith(\'#\')) code = \'#\' + code; if (/^#[0-9A-Fa-f]{6}$/.test(code)) { state.bgColor = code.toUpperCase(); document.getElementById(\'bgNativeColor\').value = state.bgColor; } scheduleRender(); }\n' +
'document.getElementById(\'multiFileInput\').addEventListener(\'change\', async function(e){\n' +
'  if (!e.target.files || !e.target.files.length) return;\n' +
'  var files = Array.from(e.target.files);\n' +
'  for (var i = 0; i < files.length; i++) {\n' +
'    var f = files[i];\n' +
'    var dataUrl = await readFile(f);\n' +
'    var im = await new Promise(function(res,rej){ var i2 = new Image(); i2.onload=function(){res(i2);}; i2.onerror=rej; i2.src=dataUrl; });\n' +
'    state.layers.push({ id: \'layer_\' + Date.now() + \'_\' + Math.random().toString(36).substr(2,5), name: f.name.replace(/\\.[^.]+$/, \'\'), img: im, origW: im.width, origH: im.height, scale: 100, opacity: 100, x: 0, y: 0 });\n' +

'});\n' +
'function calcTargetResolution() {\n' +
'  if (!state.layers.length) return { outW: 1200, outH: 675 };\n' +
'  var b = getLayerBounds(state.layers);\n' +
'  var R = state.ratioMode === \'free\' ? (state.viewW / state.viewH) : (RATIO_MAP[state.ratioMode] || 1);\n' +
'  if (Math.abs(R - 1) < 0.001) { var s = Math.max(b.maxW, b.maxH); return { outW: s, outH: s }; }\n' +
'  return R > 1 ? { outW: Math.round(b.maxH * R), outH: b.maxH } : { outW: b.maxW, outH: Math.round(b.maxW / R) };\n' +
'}\n' +
'function recalcCanvasDimensions() {\n' +
'  if (!state.layers.length) { state.viewW = 1200; state.viewH = 675; cv.width = 1200; cv.height = 675; updateFrameAspect(1200, 675); return; }\n' +

'function render() {\n' +

'function updateLayerListUI() {\n' +

'  reversed.forEach(function(l){\n' +
'    var isAct = l.id === state.activeId;\n' +

'        \'<button type="button" class="btn-mini" onclick="moveLayer(\\\'\' + l.id + \'\\\',1)" title="上移">\' + ICON_UP + \'</button>\' +\n' +
'        \'<button type="button" class="btn-mini" onclick="moveLayer(\\\'\' + l.id + \'\\\',-1)" title="下移">\' + ICON_DOWN + \'</button>\' +\n' +
'        \'<button type="button" class="btn-mini btn-danger" onclick="deleteLayer(\\\'\' + l.id + \'\\\')" title="删除">\' + ICON_TRASH + \'</button>\' +\n' +

'    listEl.appendChild(item);\n' +
'  });\n' +

'}\n' +

/* =========================================================================
 * 【模块 7】框架控制器
 * ========================================================================= */
const sidebarDrawer = document.getElementById('sidebarDrawer');
const sidebarBackdrop = document.getElementById('sidebarBackdrop');
const sidebarMenuList = document.getElementById('sidebarMenuList');
const loadingMask = document.getElementById('loadingMask');
const currentToolTitle = document.getElementById('currentToolTitle');
const frames = {};
let activeTool = '';
const blobUrls = [];

function toggleSidebar(open) {
  sidebarDrawer.classList.toggle('open', open);
  sidebarBackdrop.classList.toggle('active', open);
}

function mountTool(toolKey) {
  if (frames[toolKey]) return frames[toolKey];
  const container = document.querySelector('.frame-view[data-tool="' + toolKey + '"]');
  const iframe = document.createElement('iframe');
  iframe.title = TOOL_LIST.find(t => t.key === toolKey)?.label || toolKey;
  iframe.addEventListener('load', () => {
    iframe.classList.add('loaded');
    if (toolKey === activeTool) loadingMask.classList.remove('show');
  });
  const htmlCode = TOOL_HTMLS[toolKey] || '';
  const blob = new Blob([htmlCode], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  blobUrls.push(url);
  iframe.src = url;
  container.appendChild(iframe);
  frames[toolKey] = iframe;
  return iframe;
}

function selectTool(toolKey) {
  if (!TOOL_HTMLS[toolKey]) toolKey = 'background';
  activeTool = toolKey;
  const toolInfo = TOOL_LIST.find(t => t.key === toolKey);
  const icon = ICONS[toolInfo.iconKey] || '';
  currentToolTitle.innerHTML = icon + ' ' + toolInfo.label;

  document.querySelectorAll('.sidebar-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tool === toolKey);
  });

  document.querySelectorAll('.frame-view').forEach(view => {
    view.style.display = view.dataset.tool === toolKey ? 'block' : 'none';
  });

  const iframe = mountTool(toolKey);
  if (!iframe.classList.contains('loaded')) loadingMask.classList.add('show');
  else loadingMask.classList.remove('show');

  try { localStorage.setItem('img_tool_active', toolKey); } catch (e) {}
  toggleSidebar(false);
}

/* =========================================================================
 * 【模块 8】初始化
 * ========================================================================= */
tightenAllIconViewBoxes();
buildAllToolHTMLs();

document.getElementById('btnMenu').innerHTML = ICONS.menu;
document.getElementById('btnClose').innerHTML = ICONS.close;

TOOL_LIST.forEach(item => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'sidebar-item';
  btn.dataset.tool = item.key;
  const icon = ICONS[item.iconKey] || '';
  btn.innerHTML = '<span class="item-icon">' + icon + '</span><span>' + item.label + '</span>';
  btn.addEventListener('click', () => selectTool(item.key));
  sidebarMenuList.appendChild(btn);
});

let initTool = 'background';
try { initTool = localStorage.getItem('img_tool_active') || 'background'; } catch (e) {}
selectTool(initTool);

window.addEventListener('beforeunload', () => {
  blobUrls.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) {} });
});
</script>
</body>
</html>
