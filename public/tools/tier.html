<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>角色 Tier List 排行榜生成器 (2K高清)</title>
<style>
    /* 基础重置 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif; display: flex; justify-content: center; padding: 15px; min-height: 100vh; }
    .app { display: flex; flex-direction: column; gap: 16px; max-width: 600px; width: 100%; align-items: center; }

    /* ------- 1. 预览容器外框 ------- */
    .preview-wrapper { 
        width: 100%; 
        max-width: 580px; 
        position: relative; 
        margin: 0 auto; 
        overflow: hidden; 
        border-radius: 12px; 
        box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        background: transparent;
    }

    /* ------- 卡片核心 (完全透明底，无外框) ------- */
    .card { 
        width: 580px; 
        height: 368px; 
        position: relative; 
        display: flex; 
        flex-direction: column; 
        background: transparent; 
        border: none; 
        padding: 16px;
        overflow: hidden; 
        user-select: none;
        flex-shrink: 0;
        transform-origin: top left;
        gap: 12px;
    }

    /* --- 每行的分割边框 --- */
    .tier-row {
        display: flex;
        gap: 12px;
        align-items: center;
        height: 112px;
        border-bottom: 3.5px solid rgba(0, 0, 0, 0.55); 
        padding-bottom: 12px;
    }
    .tier-row:last-child {
        border-bottom: none;
        padding-bottom: 0;
        height: 100px;
    }

    /* --- S/A/B 100x100 表头容器 --- */
    .tier-header {
        width: 100px;  
        height: 100px; 
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent; 
        border: none; 
        flex-shrink: 0;
    }

    /* SVG 矢量文字定位 */
    .tier-header svg {
        width: 100px;
        height: 100px;
        display: block;
    }

    /* --- 4个角色槽位网格 --- */
    .slots-grid {
        display: flex;
        gap: 12px;
        flex: 1;
    }

    /* --- 单个角色槽位 (完全无边框，透明底) --- */
    .slot-item {
        width: 100px;
        height: 100px;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
        background: transparent; 
        border: none; 
        outline: none;
        flex-shrink: 0;
        font-size: 0;
        line-height: 0;
    }

    /* 头像图片 */
    .slot-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block; 
        border-radius: 8px;
        border: none;
    }

    /* 角色名字底条 (修改点：高度精简至 20px 极细底条，字号放大至 14px 容纳 6 字不换行) */
    .name-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 20px; /* 修改点1：更细的遮罩底条 (20px) */
        background: rgba(0, 0, 0, 0.65); 
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 3px;
        text-align: center;
        font-size: 14px; /* 修改点2：字号加大至 14px，刚好放得下 6 个汉字不换行 */
        color: #ffffff;
        line-height: 1;
        word-break: break-all;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        font-weight: normal;
        margin: 0;
        border: none;
        outline: none;
        box-shadow: none;
        border-bottom-left-radius: 8px;
        border-bottom-right-radius: 8px;
        pointer-events: none;
    }

    /* --- 下载按钮 --- */
    .btn-download { width: 100%; max-width: 580px; padding: 14px; background: #DCA454; color: #1a1a1a; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-download:hover { background: #eabb68; }
    .btn-download:active { opacity: 0.8; }

    /* ------- 编辑器面板 ------- */
    .editor { width: 100%; background: #222; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; border: 1px solid #333; }
    .editor h3 { text-align: center; border-bottom: 1px solid #444; padding-bottom: 8px; color: #e5c07b; font-size: 16px; }
    .tier-edit-group { background: #181818; padding: 12px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
    .tier-edit-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 6px; }
    .tier-edit-title { font-weight: bold; font-size: 14px; }
    .btn-add { background: #333; color: #fff; border: 1px solid #555; padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .btn-add:hover { background: #444; }
    .btn-add:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-add:disabled:hover { background: #333; }

    .char-list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .char-edit-card { min-width: 0; background: #242424; padding: 8px; border-radius: 6px; border: 1px solid #383838; display: flex; flex-direction: column; gap: 6px; }
    .char-edit-row { min-width: 0; display: flex; gap: 6px; align-items: center; }
    .char-edit-row input[type="text"] { min-width: 0; background: #111; border: 1px solid #444; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; flex: 1; }
    .char-edit-row input[type="file"] { font-size: 10px; color: #aaa; width: 130px; }
    .btn-del { background: #7a2222; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .btn-del:hover { background: #992222; }

    .global-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: #181818; padding: 10px; border-radius: 6px; font-size: 12px; }
</style>
</head>
<body>
<div class="app">

    <!-- 1. 置顶预览卡片区域 -->
    <div class="preview-wrapper">
        <div class="card" id="card">
            <!-- S 行 -->
            <div class="tier-row">
                <div class="tier-header">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="grad-S" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FFE57F" />
                                <stop offset="100%" stop-color="#C9933B" />
                            </linearGradient>
                        </defs>
                        <!-- 底层 3D 柔和黑色阴影 -->
                        <text x="53" y="57" text-anchor="middle" dominant-baseline="central" fill="#000000" opacity="0.65" font-family="'Arial Black', 'Impact', sans-serif" font-style="italic" font-weight="900" font-size="66">S</text>
                        <!-- 顶层彩字 (原生 Arial Black 超粗体) -->
                        <text x="50" y="54" text-anchor="middle" dominant-baseline="central" fill="url(#grad-S)" font-family="'Arial Black', 'Impact', sans-serif" font-style="italic" font-weight="900" font-size="66">S</text>
                    </svg>
                </div>
                <div class="slots-grid" id="grid-S"></div>
            </div>

            <!-- A 行 -->
            <div class="tier-row">
                <div class="tier-header">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="grad-A" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#E1BEE7" />
                                <stop offset="100%" stop-color="#8F65A7" />
                            </linearGradient>
                        </defs>
                        <!-- 底层 3D 柔和黑色阴影 -->
                        <text x="53" y="57" text-anchor="middle" dominant-baseline="central" fill="#000000" opacity="0.65" font-family="'Arial Black', 'Impact', sans-serif" font-style="italic" font-weight="900" font-size="66">A</text>
                        <!-- 顶层彩字 (原生 Arial Black 超粗体) -->
                        <text x="50" y="54" text-anchor="middle" dominant-baseline="central" fill="url(#grad-A)" font-family="'Arial Black', 'Impact', sans-serif" font-style="italic" font-weight="900" font-size="66">A</text>
                    </svg>
                </div>
                <div class="slots-grid" id="grid-A"></div>
            </div>

            <!-- B 行 -->
            <div class="tier-row">
                <div class="tier-header">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="grad-B" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#B3E5FC" />
                                <stop offset="100%" stop-color="#5084A5" />
                            </linearGradient>
                        </defs>
                        <!-- 底层 3D 柔和黑色阴影 -->
                        <text x="53" y="57" text-anchor="middle" dominant-baseline="central" fill="#000000" opacity="0.65" font-family="'Arial Black', 'Impact', sans-serif" font-style="italic" font-weight="900" font-size="66">B</text>
                        <!-- 顶层彩字 (原生 Arial Black 超粗体) -->
                        <text x="50" y="54" text-anchor="middle" dominant-baseline="central" fill="url(#grad-B)" font-family="'Arial Black', 'Impact', sans-serif" font-style="italic" font-weight="900" font-size="66">B</text>
                    </svg>
                </div>
                <div class="slots-grid" id="grid-B"></div>
            </div>
        </div>
    </div>

    <!-- 下载按钮 -->
    <button class="btn-download" id="downloadBtn">⬇️ 下载 2K 全透明 PNG 图片 (1920×1218)</button>

    <!-- 2. 编辑器面板 -->
    <div class="editor">
        <h3>📝 排行榜角色编辑</h3>

        <div class="global-tools">
            <label>📂 上传角色名字字体 (TTF/WOFF): <input type="file" id="fontFile" accept=".ttf,.woff,.woff2" style="color:#aaa;"></label>
        </div>

        <!-- S 级编辑器 -->
        <div class="tier-edit-group">
            <div class="tier-edit-header">
                <span class="tier-edit-title" style="color:#FFE57F;">S 级角色 (最多 4 个)</span>
                <button class="btn-add" data-tier="S">+ 添加角色</button>
            </div>
            <div class="char-list-grid" id="editor-S"></div>
        </div>

        <!-- A 级编辑器 -->
        <div class="tier-edit-group">
            <div class="tier-edit-header">
                <span class="tier-edit-title" style="color:#E1BEE7;">A 级角色 (最多 4 个)</span>
                <button class="btn-add" data-tier="A">+ 添加角色</button>
            </div>
            <div class="char-list-grid" id="editor-A"></div>
        </div>

        <!-- B 级编辑器 -->
        <div class="tier-edit-group">
            <div class="tier-edit-header">
                <span class="tier-edit-title" style="color:#B3E5FC;">B 级角色 (最多 4 个)</span>
                <button class="btn-add" data-tier="B">+ 添加角色</button>
            </div>
            <div class="char-list-grid" id="editor-B"></div>
        </div>
    </div>

</div>

<!-- html2canvas 渲染库 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
    const TIERS = ['S', 'A', 'B'];
    const CARD_WIDTH = 580;
    const CARD_HEIGHT = 368;
    const EXPORT_WIDTH = 1920;
    const EXPORT_SCALE = EXPORT_WIDTH / CARD_WIDTH;
    const MAX_CHARACTERS_PER_TIER = 4;
    const DOWNLOAD_TEXT = '⬇️ 下载 2K 全透明 PNG 图片 (1920×1218)';

    // 核心数据模型 (S, A, B 三个品级)
    const tierData = {
        S: [],
        A: [],
        B: []
    };

    function escapeHTML(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function revokeCharacterImage(item) {
        if (item && item.imgUrl && item.imgUrl.startsWith('blob:')) {
            URL.revokeObjectURL(item.imgUrl);
        }
    }

    function waitForImages(root) {
        const images = Array.from(root.querySelectorAll('img'));
        return Promise.all(images.map(img => {
            if (img.complete && img.naturalWidth > 0) return Promise.resolve();
            return new Promise(resolve => {
                img.onload = resolve;
                img.onerror = resolve;
            });
        }));
    }

    function updateAddButtons() {
        document.querySelectorAll('.btn-add[data-tier]').forEach(btn => {
            const tier = btn.dataset.tier;
            const isFull = tierData[tier].length >= MAX_CHARACTERS_PER_TIER;
            btn.disabled = isFull;
            btn.textContent = isFull ? '已满 4 个' : '+ 添加角色';
        });
    }

    // 缩放卡片自适应屏幕
    function scaleCard() {
        const wrapper = document.querySelector('.preview-wrapper');
        const card = document.getElementById('card');
        if (wrapper && card) {
            const wrapperWidth = wrapper.clientWidth;
            const scale = wrapperWidth / CARD_WIDTH;
            card.style.transform = `scale(${scale})`;
            wrapper.style.height = `${CARD_HEIGHT * scale}px`;
        }
    }

    // 更新预览区域
    function updatePreview() {
        TIERS.forEach(tier => {
            const gridEl = document.getElementById(`grid-${tier}`);
            gridEl.innerHTML = '';

            const list = tierData[tier];

            // 保持固定 4 个槽位
            for (let i = 0; i < MAX_CHARACTERS_PER_TIER; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot-item';

                if (i < list.length) {
                    const item = list[i];
                    slot.innerHTML = `
                        ${item.imgUrl ? `<img src="${escapeHTML(item.imgUrl)}" class="slot-img" alt="${escapeHTML(item.name || '角色头像')}">` : ''}
                        ${item.name ? `<div class="name-overlay">${escapeHTML(item.name)}</div>` : ''}
                    `;
                }
                gridEl.appendChild(slot);
            }
        });
        scaleCard();
    }

    // 更新编辑器界面
    function renderEditor() {
        TIERS.forEach(tier => {
            const editorEl = document.getElementById(`editor-${tier}`);
            editorEl.innerHTML = '';

            tierData[tier].forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'char-edit-card';
                card.innerHTML = `
                    <div class="char-edit-row">
                        <input type="text" class="char-name-input" value="${escapeHTML(item.name)}" placeholder="角色名字" data-tier="${tier}" data-index="${index}">
                        <button class="btn-del" data-action="remove" data-tier="${tier}" data-index="${index}">删除</button>
                    </div>
                    <div class="char-edit-row">
                        <input type="file" accept="image/*" data-action="upload" data-tier="${tier}" data-index="${index}">
                    </div>
                `;
                editorEl.appendChild(card);
            });
        });
        updateAddButtons();
    }

    // 添加角色
    function addCharacter(tier) {
        if (tierData[tier].length >= MAX_CHARACTERS_PER_TIER) {
            alert(`【${tier} 级】最多只能添加 4 个角色！`);
            return;
        }
        tierData[tier].push({ name: '', imgUrl: '' });
        renderEditor();
        updatePreview();
    }

    // 删除角色
    function removeCharacter(tier, index) {
        revokeCharacterImage(tierData[tier][index]);
        tierData[tier].splice(index, 1);
        renderEditor();
        updatePreview();
    }

    // 上传角色图片
    function uploadCharImg(input, tier, index) {
        if (input.files && input.files[0]) {
            const item = tierData[tier][index];
            revokeCharacterImage(item);
            item.imgUrl = URL.createObjectURL(input.files[0]);
            updatePreview();
        }
    }

    document.querySelectorAll('.btn-add[data-tier]').forEach(btn => {
        btn.addEventListener('click', () => addCharacter(btn.dataset.tier));
    });

    document.querySelector('.editor').addEventListener('input', event => {
        if (!event.target.classList.contains('char-name-input')) return;
        const { tier, index } = event.target.dataset;
        tierData[tier][Number(index)].name = event.target.value;
        updatePreview();
    });

    document.querySelector('.editor').addEventListener('click', event => {
        if (event.target.dataset.action !== 'remove') return;
        const { tier, index } = event.target.dataset;
        removeCharacter(tier, Number(index));
    });

    document.querySelector('.editor').addEventListener('change', event => {
        if (event.target.dataset.action !== 'upload') return;
        const { tier, index } = event.target.dataset;
        uploadCharImg(event.target, tier, Number(index));
    });

    // 字体文件上传处理
    document.getElementById('fontFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const fontName = 'CustomCharFont_' + Date.now();
                const fontFace = new FontFace(fontName, event.target.result);
                fontFace.load().then((loadedFace) => {
                    document.fonts.add(loadedFace);
                    const style = document.createElement('style');
                    style.innerHTML = `.name-overlay { font-family: '${fontName}', sans-serif !important; }`;
                    document.head.appendChild(style);
                }).catch(() => alert('字体文件加载失败，请检查文件格式'));
            };
            reader.readAsArrayBuffer(file);
        }
    });

    window.addEventListener('resize', scaleCard);

    // 初始化渲染
    updatePreview();

    // --- 导出 2K 全透明 PNG 图片 ---
    document.getElementById('downloadBtn').addEventListener('click', async function() {
        const card = document.getElementById('card');
        const btn = this;

        btn.textContent = '⏳ 正在导出 2K 全透明图片...';
        btn.disabled = true;

        // 克隆卡片节点
        const clone = card.cloneNode(true);
        clone.style.transform = 'none';
        clone.style.position = 'fixed';
        clone.style.left = '0px';
        clone.style.top = '0px';
        clone.style.width = `${CARD_WIDTH}px`;
        clone.style.height = `${CARD_HEIGHT}px`;
        clone.style.margin = '0';
        clone.style.zIndex = '-99999';
        clone.style.opacity = '1';
        clone.style.pointerEvents = 'none';

        document.body.appendChild(clone);

        try {
            await waitForImages(clone);

            // 580px * 3.310345 = 1920px (2K 图像宽度)
            const canvas = await html2canvas(clone, { 
                scale: EXPORT_SCALE, 
                useCORS: true, 
                allowTaint: false,
                backgroundColor: null, // 纯透明 Alpha 通道
                logging: false,
                width: CARD_WIDTH,
                height: CARD_HEIGHT,
                x: 0,
                y: 0,
                scrollX: 0,
                scrollY: 0,
                windowWidth: CARD_WIDTH,
                windowHeight: CARD_HEIGHT
            });

            const link = document.createElement('a');
            link.download = `角色排行榜_2K全透明.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        } catch (err) {
            alert('导出失败：' + (err.message || '系统繁忙，请重试'));
        } finally {
            document.body.removeChild(clone);
            btn.textContent = DOWNLOAD_TEXT;
            btn.disabled = false;
        }
    });

    window.addEventListener('beforeunload', () => {
        TIERS.forEach(tier => {
            tierData[tier].forEach(revokeCharacterImage);
        });
    });
</script>
</body>
</html>
